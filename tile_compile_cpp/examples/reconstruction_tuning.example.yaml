# Reconstruction Tuning Configuration Example
# This configuration demonstrates extended reconstruction parameters for
# advanced users: local source-quality maps (reconstruction.quality.pyramid),
# robust clipping (reconstruction.clipping), drizzle stripe/budget control
# (reconstruction.drizzle) and registration prewarp behaviour.
#
# Provenance: the base values (linearity.max_frames, registration.star_topk,
# pcc.chroma_strength/k_max/max_condition_number/min_stars) descend from a
# GPU-vs-CPU-fallback A/B parity test (2026-08-22) aligned against reference
# run M31-REF-20260801_080824_dd07d775, so that residual sharpness/quality
# differences between CUDA and the automatic CPU fallback are attributable
# to the compute backend, not to tuning drift. For that A/B run bge.method
# was set to none to match the reference run's disabled BGE stage exactly --
# this file keeps method: auto below as the general baseline (BGE runs only
# when a significant background gradient is detected, and extended sources
# such as galaxy disks are automatically excluded from the BGE fit);
# set it to none to skip BGE unconditionally, or autobge to always run it.
# (bge.method alone is the on/off switch, "none" == disabled.)


output:
  registered_dir: registered
  write_registered_frames: false
  crop_to_nonzero_bbox: true

data:
  image_width: 0
  image_height: 0
  color_mode: OSC
  bayer_pattern: auto

calibration:
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: false
  dark_match_exposure_tolerance_percent: 10
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 5
  bias_dir: ""
  darks_dir: ""
  flats_dir: ""
  bias_master: ""
  dark_master: ""
  flat_master: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"

normalization:
  enabled: true
  mode: background
  per_channel: true

dithering:
  enabled: true
  min_shift_px: 0.7
linearity:
  enabled: true
  max_frames: 64             # aligned with M31-REF-20260801_080824_dd07d775 for the GPU/CPU-fallback A/B test
  min_overall_linearity: 0.9
  strictness: strict

registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
  affine_refinement_enabled: true       # gegatet; bei Ablehnung bleibt der globale Warp unveraendert
  smooth_local_refinement_enabled: true # Held-out/Jacobian/NCC-gegatet; sonst atomarer Warp-Fallback

  prewarp_interpolation: cubic
  debayer_first: true
  pre_debayer_method: edge_aware

global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.8
  clamp:
    - -3
    - 3
  weights:
    background: 0.25
    fwhm: 0.25
    gradient: 0.2
    noise: 0.2
    roundness: 0.1
    star_count: 0.0

chroma_denoise:
  enabled: true
  color_space: ycbcr_linear
  apply_stage: both
  protect_luma: true
  luma_guard_strength: 0.85
  # Reference chroma-to-luma noise-sigma ratio used to scale the wavelet/
  # bilateral strength to the dataset's actual noise level. Expressed
  # relative to the image's own measured luma-noise sigma, so it stays
  # meaningful across normalized, ADU, and stretched data.
  adaptation_reference_ratio: 1.0
  star_protection:
    enabled: true
    # Keep the protected footprint small: protected pixels get only
    # (1 - luma_guard_strength) of the denoise, so every protected sky
    # pixel keeps near-raw chroma noise. On a dense M31 field the combined
    # mask reached ~44% at sigma 4 and visibly re-introduced the raw
    # confetti; sigma 8 still catches the bright stars whose halos matter.
    threshold_sigma: 8
    dilate_px: 8         # must cover the full PSF (core+wings); 3 caused green halos
  structure_protection:
    enabled: true
    gradient_percentile: 95   # top-5% gradients only; 90 masked another ~10% of sky
  chroma_wavelet:
    enabled: true
    levels: 4
    threshold_scale: 2.5
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 2
    sigma_range: 0.05
  blend:
    mode: chroma_only
    amount: 1.0
  extended_source_protection:
    # Protect galaxy disks, large nebulae and diffuse halos from chroma
    # denoising. Without this, the wavelet threshold treats the galaxy's
    # smooth warm excess as color noise and erases it, causing a green cast
    # in the stretched output. The detection uses a heavily blurred luma map;
    # any pixel whose smoothed luma exceeds sky_median + luma_sigma * sky_sigma
    # is blended back to its original chroma.
    enabled: true
    luma_sigma: 2.5   # detection threshold in sky-sigma; lower = protect more
    dilate_px: 15     # margin around the detected source; keep it tight --
                      # every protected pixel keeps near-raw chroma noise
  large_scale_bias:
    # The wavelet/bilateral stages above only shrink *detail* relative to a
    # progressively-blurred low-pass version and by construction never touch
    # that low-pass remainder, so a background color cast wider than roughly
    # the wavelet's coarsest scale (2^(chroma_wavelet.levels-1)*0.75 px)
    # passes through untouched regardless of blend/protection settings. This
    # stage estimates a coarse block-median surface from unprotected
    # (background-only) pixels, smooths it, and subtracts `strength` of its
    # deviation from the surface's own global background median (the
    # overall background chroma level is preserved; only spatial variation
    # across it is flattened). Enable when residual color blotches remain
    # after the wavelet/bilateral stages.
    #
    # SAFE ONLY when extended_source_protection (above) achieves near-full
    # coverage of the target, because this stage treats every pixel OUTSIDE
    # that mask as "background" and subtracts a surface fitted to it. There
    # is no automatic statistical fallback for a missing/insufficient
    # protection dilation: both the median used for the background reference
    # and any outlier-style check share the same ~50%-breakdown behaviour,
    # so neither can reliably separate "sky" from "large foreground object"
    # on chroma values alone once the object is large enough to matter.
    #
    # Compact objects (e.g. a galaxy like M31) usually work: the object has
    # a genuinely flat sky around it, so extended_source_protection can
    # cover it fully at a reasonable luma_sigma/dilate_px.
    #
    # Large diffuse emission nebulae (M42-class) usually do NOT: the nebula
    # fills a large fraction of the frame with real color that fades
    # gradually into the sky, so there is no clean luma threshold between
    # "nebula" and "background". On a real M42 run, the default
    # luma_sigma: 2.5 protected only ~1% of the frame (the bright core);
    # the other ~99% -- most of it real, colored nebulosity -- was treated
    # as background and subtracted, producing a blue ring at the mask edge
    # and yellow/green blotches across the nebula. A luma_sigma scan on
    # that frame found no safe middle ground either (1.0 -> ~7% coverage,
    # 0.75 -> ~49%: no threshold isolates "just the nebula"). Default off;
    # before enabling, check artifacts/chroma_denoise.json ->
    # extended_source_protected_fraction against the target's true visual
    # extent, not just against sky_sigma.
    enabled: false
    block_size: 32     # px, grid cell size for the block-median estimate
    blur_sigma: 24.0    # px, smoothing of the block grid into a continuous surface
    strength: 1.0       # 0..1, fraction of the estimated bias removed

astrometry:
  enabled: true
  astap_bin: ""
  astap_data_dir: /media/data/Astro/astap
  search_radius: 183

stacking:
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0
# Background gradient estimation
bge:
  # auto: measure the background gradient first; only run AutoBGE when the
  # gradient amplitude exceeds auto_detect.gradient_threshold (relative to
  # sky median), and automatically exclude extended sources (galaxies,
  # nebulae) from the BGE fit so the polynomial/RBF model uses only real
  # sky pixels.  Use autobge to always run, none to always skip.
  method: auto
  auto_detect:
    gradient_threshold: 0.05          # BGE runs only if max−min of linear sky plane > 5% of sky median
    extended_source_sigma: 3.0        # blocks above sky_med + 3σ are excluded from sample set
    extended_source_dilate_px: 50     # safety margin around detected extended source (px)
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 24
    holdout_fraction: 0.25
    alpha_flatness: 0.25
    beta_roughness: 0.1
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.2
  structure_thresh_percentile: 0.8
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1

# Photometric color calibration
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 3
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: always
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: /media/data/Astro/siril_catalog
  apply_attenuation: true
  chroma_strength: 1.0
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.9

# Final stretching
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.12
  protect_b: 6
  convergence_power: 4
  log_d_mode: fixed
  fixed_log_d: 3.5
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  # Highlight ceiling used by ready_to_use's adaptive_output_scaling: 100
  # (default) means the single brightest real pixel never clips, which on a
  # target with one very bright, compact highlight (e.g. a nebula core) caps
  # the whole frame's contrast far below what the rest of the image could
  # otherwise use -- on a real M42 run this cut the achievable contrast
  # scale to ~0.6%, with black/white_clip_percent both staying exactly 0.0.
  # Lower (e.g. 99.9) trades a small, bounded top fraction of pixels
  # clipping for materially more contrast/"punch" in stars and highlight
  # regions. Only moves the top ~1-2% of the tone range -- it does NOT
  # brighten the dark/mid-tone body (sky, faint nebulosity); that stays
  # pinned to target_bg by the final MTF match regardless. To lift the
  # faint/dark regions too, raise target_bg as well (independent, additive
  # lever). Range [90,100].
  highlight_ceiling_percentile: 100
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

# Reconstruction (CFA Forward Drizzle + Multiband) -- the only method.
# Values below carry the production tuning formerly held under aqmh.*:
# asymmetric clipping (2.0/4.0), lower n_eff floor, 4 robust passes and a
# flatter score sigmoid; the remaining keys show the schema defaults.
reconstruction:
  common_overlap_required_fraction: 1.0
  delete_source_cache_after_run: true
  keep_profile_cache_after_run: false
  diagnostics:
    level: full
    preview_forward_drizzle_uniform: false
    persist_forward_drizzle_uniform_store: false
  drizzle:
    internal_scale: 2
    output_scale: 1
    kernel: square
    pixfrac: 0.6
    robust_passes: 4
    min_clip_contributors: 5
    chunk_rows: 0
    chunk_halo_rows: -1
    memory_budget_mb: 0
  clipping:
    clip_sigma_low: 2.0
    clip_sigma_high: 4.0
    min_fraction: 0.4
    min_n_eff: 2.0
    guard_fallback: false
  coverage_gate:
    min_frames: 2
    min_supported_fraction: 0.995
    min_channel_n_eff_floor: 3.0
    min_channel_n_eff_fraction: 0.15
    min_analysis_pixels: 1024
    max_internal_hole_area_px: 0
  quality:
    pyramid:
      scales: 4
      base_window_px: 4
      sharpness_weight: 0.6
      snr_weight: 0.4
      score_scale: 0.6
      artifact_sigma: 3.0
      max_artifact_fraction: 0.25
  multiband:
    enabled: true
    levels: 3
    alpha_cap: 1.0
    fine_quality_exponent: 4.0
    medium_quality_exponent: 2.0
    min_quality_separation: 0.05
    full_quality_separation: 0.2
    min_effective_samples: 8.0
    full_effective_samples: 24.0

runtime_limits:
  memory_budget: 16384        # MB - ensure sufficient for reconstruction caches
  parallel_workers: 8        # Number of worker threads (>=1, 1 = sequential)
  acceleration_backend: auto
  hard_abort_hours: 6