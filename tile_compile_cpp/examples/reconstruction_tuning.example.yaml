# Reconstruction Tuning Configuration Example
# This configuration demonstrates extended reconstruction parameters for
# advanced users: local source-quality maps (reconstruction.quality.pyramid),
# robust clipping (reconstruction.clipping), drizzle stripe/budget control
# (reconstruction.drizzle) and registration prewarp behaviour.
#
# Provenance: the base values (linearity.max_frames, registration.star_topk,
# pcc.chroma_strength/k_max/max_condition_number/min_stars) descend from a
# GPU-vs-CPU-fallback A/B parity test (2026-08-22) aligned against reference
# run M31-REF-20260801_080824_dd07d775, so that residual sharpness/quality
# differences between CUDA and the automatic CPU fallback are attributable
# to the compute backend, not to tuning drift. For that A/B run bge.method
# was set to none to match the reference run's disabled BGE stage exactly --
# this file keeps method: autobge below as the general baseline
# recommendation; set it to none if you need to reproduce that exact
# comparison. (bge.method alone is the on/off switch, "none" == disabled.)


output:
  registered_dir: registered
  write_registered_frames: false
  crop_to_nonzero_bbox: true

data:
  image_width: 0
  image_height: 0
  color_mode: OSC
  bayer_pattern: auto

calibration:
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: false
  dark_match_exposure_tolerance_percent: 10
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 5
  bias_dir: ""
  darks_dir: ""
  flats_dir: ""
  bias_master: ""
  dark_master: ""
  flat_master: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"

normalization:
  enabled: true
  mode: background
  per_channel: true

dithering:
  enabled: true
  min_shift_px: 0.7
linearity:
  enabled: true
  max_frames: 64             # aligned with M31-REF-20260801_080824_dd07d775 for the GPU/CPU-fallback A/B test
  min_overall_linearity: 0.9
  strictness: strict

registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
  affine_refinement_enabled: true       # gegatet; bei Ablehnung bleibt der globale Warp unveraendert
  smooth_local_refinement_enabled: true # Held-out/Jacobian/NCC-gegatet; sonst atomarer Warp-Fallback

  prewarp_interpolation: cubic
  debayer_first: true
  pre_debayer_method: edge_aware

global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.8
  clamp:
    - -3
    - 3
  weights:
    background: 0.25
    fwhm: 0.25
    gradient: 0.2
    noise: 0.2
    roundness: 0.1
    star_count: 0.0

chroma_denoise:
  enabled: true
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.85
  star_protection:
    enabled: true
    threshold_sigma: 2   # detect fainter stars into the protection mask
    dilate_px: 8         # must cover the full PSF (core+wings); 3 caused green halos
  structure_protection:
    enabled: true
    gradient_percentile: 90
  chroma_wavelet:
    enabled: true
    levels: 4
    threshold_scale: 1.5
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 2
    sigma_range: 0.05
  blend:
    mode: chroma_only
    amount: 0.8

astrometry:
  enabled: true
  astap_bin: ""
  astap_data_dir: /media/data/Astro/astap
  search_radius: 183

stacking:
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0
# Background gradient estimation
bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 24
    holdout_fraction: 0.25
    alpha_flatness: 0.25
    beta_roughness: 0.1
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.2
  structure_thresh_percentile: 0.8
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1

# Photometric color calibration
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 3
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: /media/data/Astro/siril_catalog
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.9

# Final stretching
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.12
  protect_b: 6
  convergence_power: 4
  log_d_mode: fixed
  fixed_log_d: 3.5
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

# Reconstruction (CFA Forward Drizzle + Multiband) -- the only method.
# Values below carry the production tuning formerly held under aqmh.*:
# asymmetric clipping (2.0/4.0), lower n_eff floor, 4 robust passes and a
# flatter score sigmoid; the remaining keys show the schema defaults.
reconstruction:
  common_overlap_required_fraction: 1.0
  delete_source_cache_after_run: true
  keep_profile_cache_after_run: false
  diagnostics:
    level: full
    preview_forward_drizzle_uniform: false
    persist_forward_drizzle_uniform_store: false
  drizzle:
    internal_scale: 2
    output_scale: 1
    kernel: square
    pixfrac: 0.6
    robust_passes: 4
    min_clip_contributors: 5
    chunk_rows: 0
    chunk_halo_rows: -1
    memory_budget_mb: 0
  clipping:
    clip_sigma_low: 2.0
    clip_sigma_high: 4.0
    min_fraction: 0.4
    min_n_eff: 2.0
    guard_fallback: false
  coverage_gate:
    min_frames: 2
    min_supported_fraction: 0.995
    min_channel_n_eff_floor: 3.0
    min_channel_n_eff_fraction: 0.15
    min_analysis_pixels: 1024
    max_internal_hole_area_px: 0
  quality:
    pyramid:
      scales: 4
      base_window_px: 4
      sharpness_weight: 0.6
      snr_weight: 0.4
      score_scale: 0.6
      artifact_sigma: 3.0
      max_artifact_fraction: 0.25
  multiband:
    enabled: true
    levels: 3
    alpha_cap: 1.0
    fine_quality_exponent: 4.0
    medium_quality_exponent: 2.0
    min_quality_separation: 0.05
    full_quality_separation: 0.2
    min_effective_samples: 8.0
    full_effective_samples: 24.0

runtime_limits:
  memory_budget: 16384        # MB - ensure sufficient for reconstruction caches
  parallel_workers: 8        # Number of worker threads (>=1, 1 = sequential)
  acceleration_backend: auto
  hard_abort_hours: 6