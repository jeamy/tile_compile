# MONO FULL-MODE Referenzkonfiguration (vollstaendig, alle Optionen)
# Zielzustand: MONO-Datensatz mit grosser Frame-Anzahl.
# Alt/Az-optimiert: robuste Registrierung bei Feldrotation und Wolkenluecken.

output:
  registered_dir: registered # Ausgabeordner fuer registrierte Frames
  write_registered_frames: true # registrierte Einzelbilder speichern
  crop_to_nonzero_bbox: true # finalen Stack auf Bounding Box nicht-null Pixel zuschneiden

data:
  image_width: 3840 # erwartete Bildbreite (px)
  image_height: 2160 # erwartete Bildhoehe (px)
  color_mode: MONO # OSC|MONO|RGB
  bayer_pattern: auto # bei MONO wirkungslos, aus Kompatibilitaetsgruenden vorhanden

linearity:
  enabled: true # Linearity-Check aktiv
  max_frames: 8 # max. Frames fuer den Check
  min_overall_linearity: 0.9 # Mindestscore fuer linearity gate
  strictness: strict # strict|moderate|permissive

calibration:
  use_bias: false # Bias-Korrektur aktivieren
  use_dark: false # Dark-Korrektur aktivieren
  use_flat: false # Flat-Korrektur aktivieren
  bias_use_master: false # vorhandenes Master-Bias direkt nutzen
  dark_use_master: false # vorhandenes Master-Dark direkt nutzen
  dark_already_bias_corrected: false
  flat_use_master: false # vorhandenes Master-Flat direkt nutzen
  dark_auto_select: true # passendes Dark automatisch waehlen
  dark_match_exposure_tolerance_percent: 5.0 # Toleranz bei Dark-Auswahl
  dark_match_use_temp: false # Temperaturmatching fuer Darks
  dark_match_temp_tolerance_c: 2.0 # Temperaturtoleranz in Grad C
  bias_dir: "" # Verzeichnis mit Bias-Frames
  darks_dir: "" # Verzeichnis mit Dark-Frames
  flats_dir: "" # Verzeichnis mit Flat-Frames
  bias_master: "" # Pfad zu Master-Bias
  dark_master: "" # Pfad zu Master-Dark
  flat_master: "" # Pfad zu Master-Flat
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz" # Dateimaske fuer Kalibrierdaten (inkl. komprimierte .fz)

normalization:
  enabled: true # fuer Methodik v3.x verpflichtend
  mode: background # background|median
  per_channel: true # bei MONO ohne Einfluss, bleibt fuer Schema-Konsistenz gesetzt

registration:
  engine: triangle_star_matching # triangle_star_matching|star_similarity|hybrid_phase_ecc|robust_phase_ecc
  enable_star_pair_fallback: true
  allow_rotation: true # PFLICHT fuer Alt/Az: Feldrotation ueber Session
  transform_model: affine # Alt/Az: affine verfeinert lokale Scale-/Shear-Reste besser
  star_topk: 80 # mehr Sterne fuer robustes Matching bei Rotation/Wolken
  star_min_inliers: 4 # Mindestzahl Inlier fuer Stern-Matching
  star_inlier_tol_px: 4.0 # toleranter fuer Rotationsresiduen
  star_dist_bin_px: 5.0 # Distanz-Binning fuer Sternpaare
  reject_outliers: true # globale Registrierungs-Ausreisser verwerfen
  reject_cc_min_abs: 0.25 # bei Randrotation/Wolken und schwankendem Overlap toleranter
  reject_shift_px_min: 100.0 # Alt/Az: grosse Shifts durch Feldrotation sind normal
  reject_shift_median_multiplier: 5.0 # weite Shift-Verteilung zulassen
  reject_scale_min: 0.92 # minimale erlaubte Similarity-Skalierung
  reject_scale_max: 1.08 # maximale erlaubte Similarity-Skalierung
  auto_engine: true # automatisch auf triangle_star_matching+affine wechseln bei erkannter Feldrotation (Alt/Az)
  auto_engine_rotation_threshold_deg: 0.05 # Schwelle in Grad/Frame fuer Auto-Engine-Override
  # Neue Parameter (v2.0)
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05  # niedriger = mehr direkte Anker
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200       # Alt/Az: Shift-Suchradius (px im Proxy); EQ-Montierung: 60
  # Gescheiterte Registrierungen werden per Polynomial-Feldrotationsmodell
  # vorhergesagt (statt Frame-Verwerfen), damit alle Frames nutzbar bleiben.

  prewarp_interpolation: linear

dithering:
  enabled: true # true bei aktivem Dithering waehrend Aufnahme
chroma_denoise:
  enabled: false # bei MONO deaktiviert; Block bleibt fuer Vollstaendigkeit enthalten
  color_space: ycbcr_linear # ycbcr_linear|opponent_linear
  apply_stage: post_stack_linear # pre_stack_tiles|post_stack_linear
  protect_luma: true # relevant nur wenn enabled=true
  luma_guard_strength: 0.75 # 0..1
  adaptation_reference_ratio: 1.0 # relativ zum Luma-Rausch-Sigma, nicht absolut
  star_protection:
    enabled: true
    threshold_sigma: 2.2
    dilate_px: 2
  structure_protection:
    enabled: true
    gradient_percentile: 85
  chroma_wavelet:
    enabled: true
    levels: 3
    threshold_scale: 1.25
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 1.2
    sigma_range: 0.04
  blend:
    mode: chroma_only
    amount: 0.85
  large_scale_bias:
    enabled: false # entfernt grossflaechigen Farbstich, den Wavelet/Bilateral nicht erreichen
    block_size: 32
    blur_sigma: 24.0
    strength: 1.0
  # Preset-Hinweis (nur fuer OSC/RGB sinnvoll):
  # conservative: amount 0.65, threshold_scale 1.0, sigma_range 0.03
  # balanced:     amount 0.85, threshold_scale 1.25, sigma_range 0.04
  # aggressive:   amount 0.95, threshold_scale 1.5, sigma_range 0.05

global_metrics:
  adaptive_weights: true # adaptive Gewichtung nach Metrikvarianz
  weight_exponent_scale: 1.8 # k in G_f = exp(k*Q_f)
  weights:
    background: 0.4 # Gewicht fuer Hintergrundmetrik
    fwhm: 0.0
    noise: 0.3 # Gewicht fuer Rauschmetrik
    gradient: 0.30 # Gewicht fuer Struktur/Gradientenenergie
    roundness: 0.0
    star_count: 0.0
  clamp: [-3.0, 3.0] # Clipping-Grenzen fuer z-Score-Metriken

astrometry:
  enabled: true # WCS-Solve aktiv
  astap_bin: "" # leer => Systempfad
  astap_data_dir: /media/data/Astro/astap # ASTAP-Datenverzeichnis
  search_radius: 183 # Suchradius in Grad


bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1.0
  autotune:
    enabled: true # optionales deterministisches BGE-Autotuning (v3.3.6 §6.3.7)
    strategy: conservative # conservative | extended
    max_evals: 24 # harte Obergrenze getesteter Kandidaten
    holdout_fraction: 0.25 # CV-Anteil, gueltig in [0.05, 0.50]
    alpha_flatness: 0.25 # Gewicht E_flat im Ziel J
    beta_roughness: 0.10 # Gewicht E_rough im Ziel J

  sample_estimator: quantile # quantile|sigma_clipped_median|sextractor_mode|biweight
  min_sample_bg_value: 1.0
  sample_quantile: 0.20 # Quantil fuer Tile-Background (0.20 = konservativ, 0.50 = median)
  structure_thresh_percentile: 0.8 # High-Structure-Tiles ausschliessen
  min_tiles_per_cell: 3 # Mindestanzahl Tiles pro Grid-Cell
  min_valid_sample_fraction_for_apply: 0.30 # Mindestanteil valider robuster Tile-Samples je Kanal
  min_valid_samples_for_apply: 96 # absolute Untergrenze robuster Tile-Samples je Kanal
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard # discard | nearest | radius_expand
  fit:
    method: rbf # poly | spline | bicubic | rbf | modeled_mask_mesh
    robust_loss: huber # huber | tukey
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 1e-4
    polynomial_order: 2
    rbf_phi: multiquadric # thinplate | multiquadric | gaussian
    rbf_mu_factor: 1.5 # breitere RBF-Basis, vermeidet Wolkenbildung
    rbf_lambda: 1e-2 # staerkere Regularisierung, verhindert RBF-Ueberschwinger
    rbf_epsilon: 1.0 # sinnvoller Startwert fuer Multiquadric

pcc:
  enabled: false # fuer MONO i.d.R. deaktiviert
  source: siril # auto|siril|vizier_gaia|vizier_apass
  mag_limit: 14 # maximal beruecksichtigte Sternhelligkeit
  mag_bright_limit: 6 # helle Sterne fuer robustes Fit begrenzen
  aperture_radius_px: 8 # Photometrie-Apertur
  annulus_inner_px: 10 # Hintergrundring innen
  annulus_outer_px: 16 # Hintergrundring aussen
  min_stars: 3 # Mindestanzahl Referenzsterne
  sigma_clip: 2.5 # Sigma-Clipping fuer Regressionsfit
  background_model: plane # median | plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm # fixed | auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3.0
  annulus_outer_fwhm_mult: 5.0
  min_aperture_px: 4.0
  siril_catalog_dir: "" # leer => Standardkatalogpfad
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.5

hypermetric_stretch:
  enabled: true # VeraLux HMS nach PCC; erzeugt outputs/stacked_rgb_hms.fits
  require_successful_pcc: true # nur nach erfolgreicher PCC anwenden
  mode: ready_to_use # ready_to_use | scientific
  sensor_profile: rec709 # rec709 oder VeraLux-Profilname
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto # auto | fixed
  fixed_log_d: 2
  color_strategy: fixed # fixed entspricht Python-Slider-Default
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0 # nur in scientific wirksam
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

stacking:
  per_frame_cosmetic_correction: true # Per-Frame Hotpixel-Korrektur vor dem Warp
  per_frame_cosmetic_correction_sigma: 2.0 # Sigma-Schwelle fuer per_frame_cosmetic_correction (Default: 5.0)

runtime_limits:
  parallel_workers: 8 # Anzahl paralleler Worker fuer Tile-Phasen (CPU/memory capped)
  memory_budget: 4096
  acceleration_backend: auto # GPU-Backend: auto (CUDA->OpenCL->CPU), opencv_cuda (NVIDIA), opencv_opencl (AMD/Intel), cpu
  hard_abort_hours: 6.0 # harte Laufzeitgrenze

reconstruction:
  delete_source_cache_after_run: true
  clipping:
    clip_sigma_high: 4.0
    clip_sigma_low: 2.0
    min_n_eff: 2.0
  diagnostics:
    level: full
  drizzle:
    robust_passes: 4