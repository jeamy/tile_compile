astrometry:
  astap_bin: ""
  astap_data_dir: /media/data/Astro/astap
  enabled: true
  search_radius: 183
bge:
  autotune:
    alpha_flatness: 0.35
    beta_roughness: 0.08
    enabled: true
    holdout_fraction: 0.2
    max_evals: 32
    strategy: conservative
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  fit:
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 1.00e-04
    method: rbf
    polynomial_order: 2
    rbf_epsilon: 0.8
    rbf_lambda: 0.01
    rbf_mu_factor: 1.6
    rbf_phi: multiquadric
    robust_loss: huber
  grid:
    G_max_fraction: 0.25
    G_min_px: 64
    N_g: 36
    insufficient_cell_strategy: radius_expand
  mask:
    sat_dilate_px: 5
    star_dilate_px: 5
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  sample_estimator: quantile # quantile|sigma_clipped_median|sextractor_mode|biweight
  min_sample_bg_value: 1.0
  sample_quantile: 0.15
  structure_thresh_percentile: 0.8
  tile_weight_lambda_structure: 1
calibration:
  bias_dir: ""
  bias_master: ""
  bias_use_master: false
  dark_auto_select: true
  dark_already_bias_corrected: false
  dark_master: ""
  dark_match_exposure_tolerance_percent: 8
  dark_match_temp_tolerance_c: 3
  dark_match_use_temp: false
  dark_use_master: false
  darks_dir: ""
  flat_master: ""
  flat_use_master: false
  flats_dir: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"
  use_bias: false
  use_dark: false
  use_flat: false
chroma_denoise:
  apply_stage: post_stack_linear
  blend:
    amount: 0.75
    mode: chroma_only
  chroma_bilateral:
    enabled: true
    sigma_range: 0.06
    sigma_spatial: 2
  chroma_wavelet:
    enabled: true
    levels: 4
    soft_k: 1.1
    threshold_scale: 1.6
  color_space: ycbcr_linear
  enabled: true
  luma_guard_strength: 0.92
  protect_luma: true
  star_protection:
    dilate_px: 3
    enabled: true
    threshold_sigma: 3
  structure_protection:
    enabled: true
    gradient_percentile: 94
data:
  color_mode: OSC
  bayer_pattern: auto
  image_width: 0
  image_height: 0
dithering:
  enabled: true
global_metrics:
  adaptive_weights: true
  clamp:
    - -3
    - 3
  weight_exponent_scale: 1.2
  weights:
    background: 0.4
    fwhm: 0.0
    gradient: 0.25
    noise: 0.35
    roundness: 0.0
    star_count: 0.0
input:
  max_frames: 0
  pattern: ./data/*.fits
  sort: numeric
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: moderate
log_level: info
normalization:
  enabled: true
  mode: background
  per_channel: true
output:
  crop_to_nonzero_bbox: true
  registered_dir: registered
  write_registered_frames: true
pcc:
  annulus_inner_fwhm_mult: 3
  annulus_inner_px: 10
  annulus_outer_fwhm_mult: 5
  annulus_outer_px: 16
  aperture_fwhm_mult: 1.8
  aperture_radius_px: 8
  apply_attenuation: false
  background_model: plane
  background_neutralization_mode: auto
  chroma_strength: 0.85
  enabled: true
  k_max: 2.4
  mag_bright_limit: 6
  mag_limit: 14
  max_condition_number: 3
  max_residual_rms: 0.9
  min_aperture_px: 4
  min_stars: 10
  radii_mode: auto_fwhm
  sigma_clip: 2.5
  siril_catalog_dir: ""
  source: siril
registration:
  allow_rotation: true
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  enable_star_pair_fallback: true
  engine: triangle_star_matching
  reject_cc_min_abs: 0.25
  reject_outliers: true
  reject_scale_max: 1.08
  reject_scale_min: 0.92
  reject_shift_median_multiplier: 5
  reject_shift_px_min: 120
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05  # niedriger = mehr direkte Anker
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200       # Alt/Az: Shift-Suchradius (px im Proxy); EQ-Montierung: 60
  star_dist_bin_px: 5
  star_inlier_tol_px: 4
  star_min_inliers: 4
  star_topk: 80
  transform_model: affine
  prewarp_interpolation: linear

run_dir: ./run_m31_background_gradient_balanced
runtime_limits:
  acceleration_backend: auto
  hard_abort_hours: 6
  memory_budget: 4096
  parallel_workers: 8
scenario_profile:
  gui2_scenarios:
    - osc
    - m45
    - open_cluster
    - high_altitude
    - strong_rotation
  id: m45_high_altitude_strong_rotation
  intent: M45/OSC in grosser Hoehe mit starker Feldrotation; Fokus auf robuster Registrierung und sauberer Hotpixel-Unterdrueckung.
  priority: robust_registration_and_color
  recommended_for:
    - M45 / Plejaden und aehnliche helle offene Sternhaufen in grosser Hoehe
    - Alt/Az Sessions mit starker Feldrotation
  title: M45 High Altitude Strong Rotation
hypermetric_stretch:
  enabled: true # VeraLux HMS nach PCC; erzeugt outputs/stacked_rgb_hms.fits
  require_successful_pcc: true # nur nach erfolgreicher PCC anwenden
  mode: ready_to_use # ready_to_use | scientific
  sensor_profile: rec709 # rec709 oder VeraLux-Profilname
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto # auto | fixed
  fixed_log_d: 2
  color_strategy: fixed # fixed entspricht Python-Slider-Default
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0 # nur in scientific wirksam
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

stacking:
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0

reconstruction:
  delete_source_cache_after_run: true
  clipping:
    clip_sigma_high: 4.0
    clip_sigma_low: 2.0
    min_n_eff: 2.0
  diagnostics:
    level: full
  drizzle:
    robust_passes: 4