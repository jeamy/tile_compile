# Smart-Telescope Profil: DWARF / Seestar mit sehr hellem oder saturiertem Stern im Feld
# Vollstaendig, alle Optionen; optimiert fuer Alt/Az + kurze OSC-Subframes + grosses Sternhalo.
# Ziel: Tile-Seams und quadratische Halo-/Sternartefakte bei dominanter heller Quelle reduzieren.

method: aqmh
run_dir: ./run_smart_telescope_very_bright_star
log_level: info # trace|debug|info|warn|error

pipeline:
  mode: production # production|test

output:
  registered_dir: registered # Ausgabeordner fuer registrierte Frames
  write_registered_frames: true # registrierte Einzelbilder speichern
  crop_to_nonzero_bbox: true # finalen Stack auf Bounding Box nicht-null Pixel zuschneiden

data:
  image_width: 0
  image_height: 0
  color_mode: OSC
  bayer_pattern: auto

input:
  pattern: ./data/*.fits # Input-Glob fuer Rohframes
  sort: numeric # numeric|lexicographic
  max_frames: 0 # 0 = alle; >0 limitiert Inputanzahl

linearity:
  enabled: true # Linearity-Check aktiv
  max_frames: 8 # max. Frames fuer den Check
  min_overall_linearity: 0.9 # Mindestscore fuer linearity gate
  strictness: moderate # bei sehr hellen Kernen nicht unnoetig verwerfend

calibration:
  use_bias: false # Bias-Korrektur aktivieren
  use_dark: false # Dark-Korrektur aktivieren
  use_flat: false # Flat-Korrektur aktivieren
  bias_use_master: false # vorhandenes Master-Bias direkt nutzen
  dark_use_master: false # vorhandenes Master-Dark direkt nutzen
  dark_already_bias_corrected: false
  flat_use_master: false # vorhandenes Master-Flat direkt nutzen
  dark_auto_select: true # passendes Dark automatisch waehlen
  dark_match_exposure_tolerance_percent: 8.0 # Smart-Telescope oft variablere Sequenzen
  dark_match_use_temp: false # Temperaturmatching optional
  dark_match_temp_tolerance_c: 3.0 # Temperaturtoleranz in Grad C
  bias_dir: "" # Verzeichnis mit Bias-Frames
  darks_dir: "" # Verzeichnis mit Dark-Frames
  flats_dir: "" # Verzeichnis mit Flat-Frames
  bias_master: "" # Pfad zu Master-Bias
  dark_master: "" # Pfad zu Master-Dark
  flat_master: "" # Pfad zu Master-Flat
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz" # Dateimaske fuer Kalibrierdaten (inkl. komprimierte .fz)

assumptions:
  frames_min: 30 # niedrigere Untergrenze fuer kurze Smart-Telescope-Serien
  frames_reduced_threshold: 120 # Full-Mode ab 120, darunter Reduced/Emergency
  reduced_mode_skip_clustering: true # kleine Datensaetze: Clustering oft nicht stabil
  reduced_mode_cluster_range: [3, 10] # geringere Clusterzahl fuer kleinere N

normalization:
  enabled: true # fuer Methodik v3.x verpflichtend
  mode: background # background|median
  per_channel: true #

registration:
  engine: triangle_star_matching # triangle_star_matching|star_similarity|hybrid_phase_ecc|robust_phase_ecc
  enable_star_pair_fallback: true
  allow_rotation: true # PFLICHT fuer Alt/Az: Feldrotation erzeugt >20 Grad ueber eine Session
  transform_model: affine # Alt/Az: affine verfeinert lokale Scale-/Shear-Reste besser
  star_topk: 80 # trotz dominanter heller Sterne genug schwaechere Sterne einbeziehen
  star_min_inliers: 5 # Mindestzahl Inlier fuer Stern-Matching
  star_inlier_tol_px: 4.0 # toleranter fuer Rotationsresiduen
  star_dist_bin_px: 5.0 # Distanz-Binning fuer Sternpaare
  reject_outliers: true # globale Registrierungs-Ausreisser verwerfen
  reject_cc_min_abs: 0.25 # bei Feldrotation/Halos und schwankendem Overlap nicht zu streng
  reject_shift_px_min: 100.0 # HOCH fuer Alt/Az: Feldrotation erzeugt natuerlich grosse Shifts
  reject_shift_median_multiplier: 5.0 # weite Shift-Verteilung bei Feldrotation tolerieren
  reject_scale_min: 0.92 # minimale erlaubte Similarity-Skalierung
  reject_scale_max: 1.08 # maximale erlaubte Similarity-Skalierung
  auto_engine: true  # bei erkannter Feldrotation automatisch auf triangle_star_matching+affine wechseln (Alt/Az)
  auto_engine_rotation_threshold_deg: 0.05  # Schwelle in Grad/Frame fuer Auto-Engine-Override
  # Neue Parameter (v2.0) — use_astrometry false bei sehr hellen Sternen
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05  # niedriger = mehr direkte Anker
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: false  # ASTAP hat Probleme mit sehr hellen Sternen
  enable_local_background_subtraction: false
  star_shift_radius_px: 200       # Alt/Az: Shift-Suchradius (px im Proxy); EQ-Montierung: 60

dithering:
  enabled: false # Smart-Telescope Session typischerweise ohne klassisches Dithering
  min_shift_px: 0.7 # Schwellwert fuer Dither-Erkennung in Pixeln

tile_denoise:
  soft_threshold:
    enabled: false # bei grossen Halos keine zusaetzliche tile-lokale Dynamik erzeugen
    blur_kernel: 21 # kleiner Kernel fuer kompaktere Aufloesungen
    alpha: 1.2 # konservativer Schwellwert, falls aktiviert
    skip_star_tiles: true # sternreiche Tiles vom Denoise ausnehmen
  wiener:
    enabled: false # fuer sehr helle Sterne konservativ deaktiviert
    snr_threshold: 4.0 # moderater Schwellwert
    q_min: -0.5 # untere Strukturqualitaetsgrenze
    q_max: 1.0 # obere Strukturqualitaetsgrenze
    q_step: 0.1 # Schrittweite in q-Optimierung
    min_snr: 2.0 # minimaler SNR fuer stabile Schaetzung
    max_iterations: 10 # Iterationslimit der Wiener-Optimierung

chroma_denoise:
  enabled: true # Farbrausch-Reduktion fuer OSC-Daten
  color_space: ycbcr_linear # ycbcr_linear|opponent_linear
  apply_stage: post_stack_linear # pre_stack_tiles|post_stack_linear
  protect_luma: true # Luma/Struktur besser erhalten
  luma_guard_strength: 0.85 # Halo-/Kernkanten staerker schuetzen
  star_protection:
    enabled: true
    threshold_sigma: 2.0
    dilate_px: 4
  structure_protection:
    enabled: true
    gradient_percentile: 90
  chroma_wavelet:
    enabled: true
    levels: 3
    threshold_scale: 1.0
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 1.2
    sigma_range: 0.03
  blend:
    mode: chroma_only
    amount: 0.70
  # Preset-Hinweis:
  # conservative: amount 0.65, threshold_scale 1.0, sigma_range 0.03
  # balanced:     amount 0.85, threshold_scale 1.25, sigma_range 0.04
  # aggressive:   amount 0.95, threshold_scale 1.5, sigma_range 0.05

global_metrics:
  adaptive_weights: false # Extremgewichte um saturierte Halos vermeiden
  weight_exponent_scale: 1.0 # geringere Spreizung reduziert lokale Dominanz
  weights:
    background: 0.45 # Halo-/Gradientstabilitaet etwas wichtiger gewichten
    fwhm: 0.0
    noise: 0.30 # Rauschgewicht moderat halten
    gradient: 0.25 # Struktur/Gradientenenergie
    roundness: 0.0
    star_count: 0.0
  clamp: [-1.5, 1.5] # enges Clipping reduziert Gewichtsausreisser

tile:
  size_factor: 32 # groessere Tiles als im Standard-Smart-Telescope-Profil
  min_size: 96 # groesseres Minimum fuer stabilere OLA-Transitionen
  max_divisor: 5 # weniger Unterteilung reduziert sichtbare Kachelstruktur
  overlap_fraction: 0.45 # mehr Ueberlappung fuer weichere Tile-Naehte
  star_min_count: 10 # hoehere Schwelle fuer robustere STAR-Klassifikation
  star_soft_count: 5

local_metrics:
  clamp: [-1.5, 1.5] # engeres Clipping fuer lokale z-Score-Metriken
  k_local: 1.0
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0.0
  spatial_regularization:
    enabled: false
    lambda: 0.0
    passes: 0
    tau_local: 1.0
  star_mode:
    weights:
      fwhm: 0.7 # Schwerpunkt auf Sternprofil statt aggressivem Kontrast
      roundness: 0.2 # Gewicht Sternrundheit
      contrast: 0.1 # Kontrast geringer gewichten, da saturierte Kerne instabil sind
  structure_mode:
    metric_weight: 0.6 # Strukturmetrik leicht reduziert
    background_weight: 0.4 # lokaler Hintergrund wichtiger bei Halos

synthetic:
  weighting: global # global|tile_weighted; vermeidet lokale Dominanz einzelner Tiles
  frames_min: 4 # kleinere Cluster tolerieren
  frames_max: 20 # Synthetic-Anzahl begrenzen
  clustering:
    mode: kmeans # kmeans|quantile
    cluster_count_range: [3, 12] # [k_min, k_max] fuer kleinere Datensaetze


astrometry:
  enabled: true # WCS-Solve aktiv
  astap_bin: "" # leer => Systempfad
  astap_data_dir: /media/data/Astro/astap # ASTAP-Datenverzeichnis
  search_radius: 183 # Suchradius in Grad

bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1.0
  autotune:
    enabled: true # optionales deterministisches BGE-Autotuning
    strategy: conservative # conservative | extended
    max_evals: 24 # harte Obergrenze getesteter Kandidaten
    holdout_fraction: 0.25 # CV-Anteil, gueltig in [0.05, 0.50]
    alpha_flatness: 0.25 # Gewicht E_flat im Ziel J
    beta_roughness: 0.10 # Gewicht E_rough im Ziel J

  sample_estimator: quantile # quantile|sigma_clipped_median|sextractor_mode|biweight
  min_sample_bg_value: 1.0
  sample_quantile: 0.15 # defensiv: eher sky-nahe Samples
  structure_thresh_percentile: 0.85 # Halo-Bereiche eher aus BGE-Samples ausschliessen
  min_tiles_per_cell: 3 # Mindestanzahl Tiles pro Grid-Cell
  min_valid_sample_fraction_for_apply: 0.28 # fuer sternreiche Felder etwas toleranter
  min_valid_samples_for_apply: 96 # absolute Untergrenze robuster Tile-Samples pro Kanal
  mask:
    star_dilate_px: 10 # helle Sternkerne/Halos grosszuegiger maskieren
    sat_dilate_px: 10
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard # discard | nearest | radius_expand
  fit:
    method: rbf # poly | spline | bicubic | rbf | modeled_mask_mesh
    robust_loss: huber # huber | tukey
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 1e-4
    polynomial_order: 2
    rbf_phi: multiquadric # thinplate | multiquadric | gaussian
    rbf_mu_factor: 1.5 # breitere RBF-Basis, vermeidet Wolkenbildung
    rbf_lambda: 1e-2 # staerkere Regularisierung, verhindert RBF-Ueberschwinger
    rbf_epsilon: 1.0 # sinnvoller Startwert fuer Multiquadric

pcc:
  enabled: true # Photometrische Farbkalibrierung aktiv
  source: siril # auto|siril|vizier_gaia|vizier_apass
  mag_limit: 14 # maximal beruecksichtigte Sternhelligkeit
  mag_bright_limit: 4 # sehr helle Referenzsterne frueher ausschliessen
  aperture_radius_px: 8 # Photometrie-Apertur
  annulus_inner_px: 10 # Hintergrundring innen
  annulus_outer_px: 16 # Hintergrundring aussen
  min_stars: 20 # robusteres Sample fuer Felder mit dominanter heller Quelle
  sigma_clip: 2.0 # konservativeres Sigma-Clipping
  background_model: plane # median | plane
  max_condition_number: 2.5 # strengere Stabilitaetsgrenze fuer PCC-Matrix
  max_residual_rms: 0.50 # maximale robuste Fit-Abweichung
  radii_mode: auto_fwhm # fixed | auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3.0
  annulus_outer_fwhm_mult: 5.0
  min_aperture_px: 4.0
  siril_catalog_dir: "" # leer => Standardkatalogpfad
  apply_attenuation: false
  background_neutralization_mode: auto
  chroma_strength: 0.8 # Farbkalibrierung etwas defensiver anwenden
  k_max: 2.0 # begrenzt extreme PCC-Skalierung

hypermetric_stretch:
  enabled: true # VeraLux HMS nach PCC; erzeugt outputs/stacked_rgb_hms.fits
  require_successful_pcc: true # nur nach erfolgreicher PCC anwenden
  mode: ready_to_use # ready_to_use | scientific
  sensor_profile: rec709 # rec709 oder VeraLux-Profilname
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto # auto | fixed
  fixed_log_d: 2
  color_strategy: fixed # fixed entspricht Python-Slider-Default
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0 # nur in scientific wirksam
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    score_scale: 1.8        # lokale AQMH-Selektivitaet
    k_artifact: 3.0
    frac_artifact_max: 0.25


  # Globale Qualitaetsgewichtung (v0.2.0)
  global_quality:
    g_floor: 0.03          # Untergrenze fuer globale Frame-Qualitaet G_f
    g_w_sharp: 0.55        # Gewicht Schaerfe in globaler Qualitaet
    g_w_snr: 0.30          # Gewicht SNR in globaler Qualitaet
    g_w_background_penalty: 0.25
    g_k_scale: 1.5

  storage:
    resolution_divisor: 2
    dtype: uint16
    max_resident_maps: 2
  cherry_pick:
    enabled: false
    mode: auto_reject
    k_min_required: 20
    k_frac: 0.30
    margin_min: 0.02      # Mindest-Rangabstand fuer Cherry-Pick-Auswahl
    tiered_k_frac: []      # Gestaffelte k_frac-Regeln (leer = k_frac fuer alle Pixel)
    reject_below_best_fraction: 0.25
    min_keep_fraction: 0.9

  # Validierungsgrenzen fuer rekonstruierte Tiles (v0.2.0)
  validation:
    max_seam_score_regression: 0.05   # Max. erlaubte Seam-Score-Regression
    max_fwhm_regression: 0.02           # Max. erlaubte FWHM-Regression
    max_background_rms_regression: 0.05  # Max. erlaubte Hintergrund-RMS-Regression
    max_tail11_abs_regression: 0.10
    max_elongation_regression: 0.08
  diagnostics:
    enabled: true
    level: full
    per_frame_blocks: true
    heatmaps: false
    regions: true
    format: json
    binary_block_size_px: 64
    tau_artifact: 0.20
    q_region: 0.75
    r_morph_canvas_px: 6
  reconstruction:
    clip_sigma: 2.0
    clip_sigma_low: 2.0
    clip_sigma_high: 4.0
    clip_iterations: 4
    min_fraction: 0.4
    min_n_eff: 2.0
    chunk_rows: 0
    memory_budget_mb: 0
    delete_prewarped_cache_after_run: true
    prewarp_interpolation: linear
    registration_weight_guard: true
    registration_weight_floor: 0.30
    registration_cc_floor: 0.35
    registration_cc_full: 0.80
    registration_sequential_factor: 0.92
    registration_predicted_factor: 0.50
    registration_chain_depth_penalty: 0.03
    registration_chain_depth_max_penalty: 0.15
    structure_mask_low_q: 0.40
    structure_mask_high_q: 0.90
    structure_mask_blur_sigma_px: 4.0
stacking:
  method: rej # rej|average
  common_overlap_required_fraction: 1.0
  tile_common_valid_min_fraction: 1.0
  sigma_clip:
    sigma_low: 2.0 # Hintergrundrauschen breit halten
    sigma_high: 1.5 # asymmetrisch: wandernde Hotpixel-Streifen aggressiv kappen
    max_iters: 3 # maximale Clip-Iterationen
    min_fraction: 0.4 # bei vielen bewoelkten Frames darf mehr geclippt werden
  cluster_quality_weighting:
    enabled: true # konservativ ohne zusaetzliche Clustergewichtung
    kappa_cluster: 1.0 # Exponentfaktor fuer Clusterqualitaet Q_k
    cap_enabled: true # optional: begrenzt Dominanz einzelner Cluster im finalen Stack
    cap_ratio: 10.0 # konservativer als Default
  output_stretch: true # optionales Display-Stretch (Post)
  cosmetic_correction: true # optionale Kosmetik (Post)
  cosmetic_correction_sigma: 4.0 # Hotpixel-Schwelle in MAD-Sigma
  per_frame_cosmetic_correction: true # fixe Sensordefekte frueh entfernen
  per_frame_cosmetic_correction_sigma: 2.0 # Sigma-Schwelle fuer per_frame_cosmetic_correction

validation:
  min_fwhm_improvement_percent: 0.0 # bei dominanter heller Quelle nicht auf FWHM-Gewinn versteifen
  max_background_rms_increase_percent: 1.0 # Hintergrund darf kaum schlechter werden
  min_tile_weight_variance: 0.03 # bei homogenem Datensatz niedriger erwartbar
  require_no_tile_pattern: true # Grid-Artefakte muessen ausbleiben

runtime_limits:
  parallel_workers: 8 # konservativer Default fuer stabile Last
  memory_budget: 4096
  acceleration_backend: auto # GPU-Backend: auto (CUDA->OpenCL->CPU), opencv_cuda (NVIDIA), opencv_opencl (AMD/Intel), cpu
  tile_analysis_max_factor_vs_stack: 3.0 # Guardrail Laufzeit Tile-Analyse
  hard_abort_hours: 6.0 # harte Laufzeitgrenze
  allow_emergency_mode: true
  tile_reconstruction_diagnostics: full
