# Classic Tile Compile Mode Configuration
# This is the legacy Tile Compile pipeline without AQMH.
# Use this configuration for the classic tile-based reconstruction method.

method: classic_tile_compile

aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    k_artifact: 3.0
    frac_artifact_max: 0.25
  storage:
    resolution_divisor: 2
    dtype: uint16
    max_resident_maps: 4

  global_quality:
    g_floor: 0.05
    g_w_sharp: 0.6
    g_w_snr: 0.4

  cherry_pick:
    enabled: false
    k_min_required: 20
    k_frac: 0.30
    margin_min: 0.02
    tiered_k_frac: []

  diagnostics:
    enabled: true
    level: full
    per_frame_blocks: true
    heatmaps: true
    regions: true
    format: json
    binary_block_size_px: 0
    tau_artifact: 0.20
    q_region: 0.75
    r_morph_canvas_px: 6
  reconstruction:
    clip_sigma: 3.0
    clip_iterations: 3
    min_fraction: 0.5
    min_n_eff: 2.0
    chunk_rows: 0
    memory_budget_mb: 0
    gpu_reconstruction: auto

  validation:
    max_seam_score_regression: 0.02
    max_fwhm_regression: 0.02
    max_background_rms_regression: 0.02

pipeline:
  mode: production
  abort_on_fail: true

output:
  registered_dir: registered
  write_registered_frames: false
  crop_to_nonzero_bbox: true

data:
  image_width: 0
  image_height: 0
  color_mode: OSC
  bayer_pattern: GBRG
  linear_required: true

linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: strict

calibration:
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: true
  dark_match_exposure_tolerance_percent: 5.0
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 2.0
  bias_dir: ""
  darks_dir: ""
  flats_dir: ""
  bias_master: ""
  dark_master: ""
  flat_master: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"

assumptions:
  frames_min: 50
  frames_reduced_threshold: 200
  reduced_mode_skip_clustering: true
  reduced_mode_cluster_range:
    - 5
    - 10

normalization:
  enabled: true
  mode: background
  per_channel: true

registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: similarity
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  star_topk: 150
  star_min_inliers: 4
  star_inlier_tol_px: 4.0
  star_dist_bin_px: 5.0
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100.0
  reject_shift_median_multiplier: 5.0
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.08
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: false
  enable_local_background_subtraction: false
  star_shift_radius_px: 200

tile:
  size_factor: 24
  min_size: 64
  max_divisor: 6
  overlap_fraction: 0.25
  star_min_count: 5
  star_soft_count: 3

local_metrics:
  clamp: [-3.0, 3.0]
  k_local: 1.0
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0.0
  spatial_regularization:
    enabled: false
    lambda: 0.0
    passes: 0
    tau_local: 1.0
  star_mode:
    weights:
      fwhm: 0.6
      roundness: 0.2
      contrast: 0.2
  structure_mode:
    metric_weight: 0.7
    background_weight: 0.3

stacking:
  method: rej
  common_overlap_required_fraction: 1.0
  tile_common_valid_min_fraction: 1.0
  output_stretch: false
  cosmetic_correction: false
  cosmetic_correction_sigma: 4.0
  per_frame_cosmetic_correction: false
  per_frame_cosmetic_correction_sigma: 2.0
  sigma_clip:
    sigma_low: 2.0
    sigma_high: 1.5
    max_iters: 4
    min_fraction: 0.4
  cluster_quality_weighting:
    enabled: false
    kappa_cluster: 1
    cap_enabled: true
    cap_ratio: 20

astrometry:
  enabled: false
  astap_bin: ""
  astap_data_dir: ""
  search_radius: 183

bge:
  enabled: false
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1.0

pcc:
  enabled: false
  source: auto
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 10
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: ""
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.5

hypermetric_stretch:
  enabled: false
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto
  fixed_log_d: 2
  color_strategy: auto
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

validation:
  min_fwhm_improvement_percent: 0
  max_background_rms_increase_percent: 5
  min_tile_weight_variance: 0.01
  require_no_tile_pattern: false

runtime_limits:
  memory_budget: 32
  parallel_workers: 8
  acceleration_backend: auto
  allow_emergency_mode: true
  hard_abort_hours: 6
  tile_analysis_max_factor_vs_stack: 3
  tile_reconstruction_diagnostics: full

dithering:
  enabled: false
  min_shift_px: 0.0

global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.0
  weights:
    background: 0.45
    fwhm: 0.0
    gradient: 0.25
    noise: 0.3
    roundness: 0.0
    star_count: 0.0
  clamp: [-3.0, 3.0]

tile_denoise:
  soft_threshold:
    enabled: false
    blur_kernel: 21
    alpha: 1.5
    skip_star_tiles: true
  wiener:
    enabled: false
    snr_threshold: 3.5
    q_min: -0.5
    q_max: 1
    q_step: 0.1
    min_snr: 2.5
    max_iterations: 10

chroma_denoise:
  enabled: false
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.85
  star_protection:
    enabled: true
    threshold_sigma: 3
    dilate_px: 3
  structure_protection:
    enabled: true
    gradient_percentile: 90
  chroma_wavelet:
    enabled: true
    levels: 4
    threshold_scale: 1.5
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 2
    sigma_range: 0.05
  blend:
    mode: chroma_only
    amount: 0.8

synthetic:
  weighting: global
  frames_min: 4
  frames_max: 20
  clustering:
    mode: kmeans
    cluster_count_range: [3, 12]
