# AQMH Tuning Configuration Example
# This configuration demonstrates extended AQMH parameters for advanced users.
# Use this for fine-tuning AQMH quality map generation, storage, and diagnostics.
#
# GPU-vs-CPU-fallback A/B parity test (2026-08-22):
# The values below (linearity.max_frames, registration.star_topk,
# tile_denoise.soft_threshold.blur_kernel, pcc.chroma_strength/k_max/
# max_condition_number/min_stars, aqmh.reconstruction.gpu_half_qmaps/
# gpu_packed_masks) are exactly the parameter set used for run
# m31-gpu-abtest_<timestamp> (runs-dir /media/tc_500), aligned against the
# reference run M31-REF-20260801_080824_dd07d775 so that any remaining
# sharpness/quality difference between CUDA and the automatic CPU fallback
# (see runner_phase_aqmh_reconstruction.cpp: rgb_cuda_session_used /
# acceleration_fallback_reason) is attributable to the compute backend, not
# to tuning drift. For that specific A/B run, bge.enabled was additionally
# set to false / method: none to match the reference run's disabled BGE
# stage exactly -- this file keeps autobge enabled below as the general
# baseline recommendation; flip it off if you need to reproduce that exact
# comparison.

method: aqmh

pipeline:
  mode: production

output:
  registered_dir: registered
  write_registered_frames: false
  crop_to_nonzero_bbox: true

data:
  image_width: 0
  image_height: 0
  color_mode: OSC
  bayer_pattern: auto

calibration:
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: false
  dark_match_exposure_tolerance_percent: 10
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 5
  bias_dir: ""
  darks_dir: ""
  flats_dir: ""
  bias_master: ""
  dark_master: ""
  flat_master: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"

assumptions:
  frames_min: 50
  frames_reduced_threshold: 150
  reduced_mode_skip_clustering: true
  reduced_mode_cluster_range:
    - 5
    - 10

normalization:
  enabled: true
  mode: background
  per_channel: true

dithering:
  enabled: true
  min_shift_px: 0.7

linearity:
  enabled: true
  max_frames: 64             # aligned with M31-REF-20260801_080824_dd07d775 for the GPU/CPU-fallback A/B test
  min_overall_linearity: 0.9
  strictness: strict

registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
  affine_refinement_enabled: true       # gegatet; bei Ablehnung bleibt der globale Warp unveraendert
  smooth_local_refinement_enabled: true # Held-out/Jacobian/NCC-gegatet; sonst atomarer Warp-Fallback

# AQMH Configuration with tuning parameters.
# Current baseline intent:
# - conservative, object-agnostic AQMH defaults for nebulae, galaxies,
#   clusters, IFN, and sparse star fields
# - affine and smooth-local registration refinements are enabled but remain
#   strictly gated; rejected candidates preserve the previous warp
# - cherry-pick stays opt-in; enable it only for high-frame-count datasets
# - the validation gate must treat degenerate or unavailable metrics as
#   not_applicable in code, not as hard failures
aqmh:
  enabled: true
  
  # Storage configuration for quality maps
  storage:
    resolution_divisor: 2      # Robust default; use 1 for cherry-pick/high-precision diagnostics
    dtype: uint16              # Compact default; use float32 for exact diagnostic runs
    max_resident_maps: 2       # Maximum maps kept in memory simultaneously
  
  # Pyramid parameters for multi-scale quality analysis
  pyramid:
    base_window_px: 4        # Base window size in pixels for quality metrics
    scales: 4                # Number of pyramid scales
    w_sharp: 0.6             # Sharpness weight in quality metric
    w_snr: 0.4               # SNR weight in quality metric
    score_scale: 0.6        # lokale AQMH-Selektivitaet
    k_artifact: 3.0           # Artifact detection sensitivity (MAD multiplier)
    frac_artifact_max: 0.25  # Maximum tolerated outlier fraction per window

  # Global quality weighting (v0.2.0)
  global_quality:
    g_floor: 0.03          # Floor for global frame quality G_f
    g_w_sharp: 0.55        # Weight for sharpness in global quality
    g_w_snr: 0.30          # Weight for SNR in global quality
    g_w_background_penalty: 0.25  # Penalty for large-scale sky gradients
    g_k_scale: 1.5         # Sigmoid temperature; G_f remains bounded to 1

  # Diagnostics parameters
  diagnostics:
    enabled: true
    level: full
    per_frame_blocks: false
    heatmaps: false
    regions: false
    format: json
    binary_block_size_px: 64
    q_region: 0.75           # Quantile for region quality threshold
    r_morph_canvas_px: 6      # Morphological radius in canvas pixels
    tau_artifact: 0.2         # Artifact fraction threshold for quality degradation
  
  # Reconstruction parameters
  reconstruction:
    clip_sigma: 2.0
    clip_sigma_low: 2.0       # Symmetric clipping preserves diffuse background level
    clip_sigma_high: 2.0
    clip_iterations: 4
    min_fraction: 0.4
    min_n_eff: 2.0
    chunk_rows: 0
    memory_budget_mb: 0
    delete_prewarped_cache_after_run: false  # fuer Resume ab AQMH_RECONSTRUCTION/STACKING erhalten
    prewarp_interpolation: linear
    debayer_first: true
    pre_debayer_method: edge_aware
    rgb_q_map_mode: shared_luma
    rgb_memory_strategy: sequential
    registration_weight_guard: true
    registration_weight_floor: 0.30
    registration_cc_floor: 0.35
    registration_cc_full: 0.80
    registration_sequential_factor: 0.92
    registration_predicted_factor: 0.50
    registration_chain_depth_penalty: 0.03
    registration_chain_depth_max_penalty: 0.15
    structure_mask_low_q: 0.40
    structure_mask_high_q: 0.90
    structure_mask_blur_sigma_px: 4.0
    gpu_half_qmaps: true    # WP-E: H2D Q-maps as fp16 (halves H2D bandwidth); GPU transfer staging only, never persisted
    gpu_packed_masks: true  # WP-E: H2D frame masks bit-packed (1 bit/pixel); GPU transfer staging only, never persisted
  
  # Cherry-pick parameters (pixel-level frame selection).
  # Keep disabled for the general baseline. If enabled for many-frame runs,
  # set storage.resolution_divisor to 1 so the selection map has full detail.
  cherry_pick:
    enabled: false
    mode: auto_reject
    k_frac: 0.50             # Fraction of best frames to use
    k_min_required: 30       # Run-level gate and per-pixel retained-sample floor
    margin_min: 0.02      # Mindest-Rangabstand fuer Cherry-Pick-Auswahl
    tiered_k_frac: []      # Gestaffelte k_frac-Regeln (leer = k_frac fuer alle Pixel)
    reject_below_best_fraction: 0.25
    min_keep_fraction: 0.9

  # Validierungsgrenzen fuer rekonstruierte Tiles.
  # Gate thresholds apply only to applicable metrics and must pass against
  # both the uniform control and the immutable raw AQMH baseline.
  # Degenerate comparisons, empty star samples, and zero baselines must be
  # not_applicable in code instead of causing false FAIL results.
  validation:
    max_fwhm_regression: 0.02           # Max. erlaubte FWHM-Regression
    max_background_rms_regression: 0.05  # Max. erlaubte Hintergrund-RMS-Regression
    max_seam_score_regression: 0.05   # Max. erlaubte Seam-Score-Regression
    max_tail11_abs_regression: 0.10   # Max. erlaubte Tail11-Regression
    max_elongation_regression: 0.08   # Max. erlaubte Elongation-Regression

global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.8
  clamp:
    - -3
    - 3
  weights:
    background: 0.25
    fwhm: 0.25
    gradient: 0.2
    noise: 0.2
    roundness: 0.1
    star_count: 0.0

local_metrics:
  clamp:
    - -3
    - 3
  k_local: 1.0
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0.0
  spatial_regularization:
    enabled: false
    lambda: 0.0
    passes: 0
    tau_local: 1.0
  star_mode:
    weights:
      fwhm: 0.6
      roundness: 0.2
      contrast: 0.2
  structure_mode:
    background_weight: 0.3
    metric_weight: 0.7

tile_denoise:
  soft_threshold:
    enabled: true
    blur_kernel: 31
    alpha: 1.8
    skip_star_tiles: true
  wiener:
    enabled: true
    snr_threshold: 5
    q_min: -0.5
    q_max: 1
    q_step: 0.1
    min_snr: 2
    max_iterations: 10

chroma_denoise:
  enabled: true
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.85
  star_protection:
    enabled: true
    threshold_sigma: 3
    dilate_px: 3
  structure_protection:
    enabled: true
    gradient_percentile: 90
  chroma_wavelet:
    enabled: true
    levels: 4
    threshold_scale: 1.5
    soft_k: 1.0
  chroma_bilateral:
    enabled: true
    sigma_spatial: 2
    sigma_range: 0.05
  blend:
    mode: chroma_only
    amount: 0.8

synthetic:
  weighting: tile_weighted
  frames_min: 4
  frames_max: 20
  clustering:
    mode: kmeans
    cluster_count_range:
      - 3
      - 12

astrometry:
  enabled: true
  astap_bin: ""
  astap_data_dir: /media/data/Astro/astap
  search_radius: 183

# Tile grid configuration
tile:
  size_factor: 32
  min_size: 64
  max_divisor: 6
  overlap_fraction: 0.25
  star_min_count: 8
  star_soft_count: 4

# Stacking configuration
stacking:
  method: rej
  common_overlap_required_fraction: 1.0
  tile_common_valid_min_fraction: 1.0
  output_stretch: false
  cosmetic_correction: true
  cosmetic_correction_sigma: 4
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0
  sigma_clip:
    sigma_low: 2.0
    sigma_high: 1.5
    max_iters: 3
    min_fraction: 0.4
  cluster_quality_weighting:
    enabled: true
    kappa_cluster: 1
    cap_enabled: false
    cap_ratio: 20

# Background gradient estimation
bge:
  enabled: true
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 24
    holdout_fraction: 0.25
    alpha_flatness: 0.25
    beta_roughness: 0.1
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.2
  structure_thresh_percentile: 0.8
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1

# Photometric color calibration
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 3
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: /media/data/Astro/siril_catalog
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.9

# Final stretching
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.12
  protect_b: 6
  convergence_power: 4
  log_d_mode: fixed
  fixed_log_d: 3.5
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

# Validation
validation:
  min_fwhm_improvement_percent: 5
  max_background_rms_increase_percent: 0
  min_tile_weight_variance: 0.1
  require_no_tile_pattern: true

# Runtime limits
runtime_limits:
  memory_budget: 4096         # MB - ensure sufficient for AQMH cache
  parallel_workers: 8        # Number of worker threads (>=1, 1 = sequential)
  acceleration_backend: auto
  allow_emergency_mode: false
  hard_abort_hours: 6
  tile_analysis_max_factor_vs_stack: 3
  tile_reconstruction_diagnostics: full
