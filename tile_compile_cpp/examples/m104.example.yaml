method: aqmh
run_dir: ./run_m104_altaz_rotation_poor_seeing
log_level: info

scenario_profile:
  id: m104_altaz_rotation_poor_seeing
  title: M104 AltAz Rotation Poor Seeing
  intent: "OSC-Galaxienfeld wie M104 mit etwas staerkerer Alt/Az-Feldrotation, wechselhaftem Seeing und Prioritaet auf robuster Registrierung sowie staerkerer Gewichtung guter Frames."
  gui2_scenarios: [osc, m104, galaxy, altaz, rotation, poor_seeing]
  recommended_for:
    - "M104 und aehnliche kompakte Galaxienfelder auf Alt/Az-Montierung mit sichtbarer Feldrotation"
    - "Sessions mit brauchbaren, aber ungleich guten Frames, bei denen gute Frames staerker gewichtet werden sollen"
    - "Datensaetze, bei denen eine Ein-Referenz-Registrierung zu langen Sequential-Ketten fuehrt"
  priority: robust_registration_and_stronger_quality_separation

pipeline:
  mode: production
  abort_on_fail: false

output:
  registered_dir: registered
  write_registered_frames: true
  crop_to_nonzero_bbox: true

data:
  color_mode: OSC
  bayer_pattern: auto
  image_width: 0
  image_height: 0

input:
  pattern: ./data/*.fits
  sort: numeric
  max_frames: 0

linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: moderate

calibration:
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: true
  dark_match_exposure_tolerance_percent: 8.0
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 3.0
  bias_dir: ""
  darks_dir: ""
  flats_dir: ""
  bias_master: ""
  dark_master: ""
  flat_master: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"

assumptions:
  frames_min: 30
  frames_reduced_threshold: 120
  reduced_mode_skip_clustering: true
  reduced_mode_cluster_range: [3, 10]

normalization:
  enabled: true
  mode: background
  per_channel: true

registration:
  engine: triangle_star_matching
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4.0
  star_dist_bin_px: 5.0
  star_shift_radius_px: 200
  reject_outliers: true
  reject_cc_min_abs: 0.15
  reject_shift_px_min: 100.0
  reject_shift_median_multiplier: 5.0
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05  # niedriger = mehr direkte Anker
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: true

dithering:
  enabled: true
  min_shift_px: 0.7

tile_denoise:
  soft_threshold:
    enabled: true
    blur_kernel: 31
    alpha: 1.5
    skip_star_tiles: true
  wiener:
    enabled: true
    snr_threshold: 5.0
    q_min: -0.5
    q_max: 1.0
    q_step: 0.1
    min_snr: 2.0
    max_iterations: 10

global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.3
  weights:
    background: 0.40
    fwhm: 0.0
    noise: 0.35
    gradient: 0.25
    roundness: 0.0
    star_count: 0.0
  clamp: [-2.5, 2.5]

local_metrics:
  clamp: [-3.0, 3.0]
  k_local: 1.0
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0.0
  spatial_regularization:
    enabled: false
    lambda: 0.0
    passes: 0
    tau_local: 1.0
  star_mode:
    weights:
      fwhm: 0.6
      roundness: 0.2
      contrast: 0.2
  structure_mode:
    metric_weight: 0.7
    background_weight: 0.3

tile:
  size_factor: 24
  min_size: 48
  max_divisor: 6
  overlap_fraction: 0.30
  star_min_count: 5
  star_soft_count: 3

synthetic:
  weighting: tile_weighted
  frames_min: 4
  frames_max: 20
  clustering:
    mode: kmeans
    cluster_count_range: [3, 12]

astrometry:
  enabled: true
  astap_bin: /home/mux/.local/share/tile_compile/astap/astap_cli
  astap_data_dir: /home/mux/.local/share/tile_compile/astap
  search_radius: 183

bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1.0
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 32
    holdout_fraction: 0.20
    alpha_flatness: 0.35
    beta_roughness: 0.08
  sample_estimator: quantile # quantile|sigma_clipped_median|sextractor_mode|biweight
  min_sample_bg_value: 1.0
  sample_quantile: 0.18
  structure_thresh_percentile: 0.8
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.30
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 5
    sat_dilate_px: 5
  grid:
    N_g: 36
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: radius_expand
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 1e-4
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.6
    rbf_lambda: 0.02
    rbf_epsilon: 0.8

pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 10
  sigma_clip: 2.5
  siril_catalog_dir: ""
  background_model: plane
  max_condition_number: 3.0
  max_residual_rms: 0.9
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3.0
  annulus_outer_fwhm_mult: 5.0
  min_aperture_px: 4.0
  apply_attenuation: false
  background_neutralization_mode: always
  chroma_strength: 0.85
  k_max: 2.4

chroma_denoise:
  enabled: true
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.92
  star_protection:
    enabled: true
    threshold_sigma: 3.0
    dilate_px: 3
  structure_protection:
    enabled: true
    gradient_percentile: 94
  chroma_wavelet:
    enabled: true
    levels: 4
    threshold_scale: 1.6
    soft_k: 1.1
  chroma_bilateral:
    enabled: true
    sigma_spatial: 2.0
    sigma_range: 0.06
  blend:
    mode: chroma_only
    amount: 0.75

hypermetric_stretch:
  enabled: true # VeraLux HMS nach PCC; erzeugt outputs/stacked_rgb_hms.fits
  require_successful_pcc: true # nur nach erfolgreicher PCC anwenden
  mode: ready_to_use # ready_to_use | scientific
  sensor_profile: rec709 # rec709 oder VeraLux-Profilname
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto # auto | fixed
  fixed_log_d: 2
  color_strategy: fixed # fixed entspricht Python-Slider-Default
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0 # nur in scientific wirksam
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    k_artifact: 3.0
    frac_artifact_max: 0.25


  # Globale Qualitaetsgewichtung (v0.2.0)
  global_quality:
    g_floor: 0.05          # Untergrenze fuer globale Frame-Qualitaet G_f
    g_w_sharp: 0.6        # Gewicht Schaerfe in globaler Qualitaet
    g_w_snr: 0.4          # Gewicht SNR in globaler Qualitaet
    g_w_background_penalty: 0.3

  storage:
    resolution_divisor: 1
    dtype: float32
    max_resident_maps: 2
  cherry_pick:
    enabled: false
    k_min_required: 20
    k_frac: 0.30
    margin_min: 0.02      # Mindest-Rangabstand fuer Cherry-Pick-Auswahl
    tiered_k_frac: []      # Gestaffelte k_frac-Regeln (leer = k_frac fuer alle Pixel)

  # Validierungsgrenzen fuer rekonstruierte Tiles (v0.2.0)
  validation:
    max_seam_score_regression: 0.02   # Max. erlaubte Seam-Score-Regression
    max_fwhm_regression: 0.02           # Max. erlaubte FWHM-Regression
    max_background_rms_regression: 0.02  # Max. erlaubte Hintergrund-RMS-Regression
  diagnostics:
    enabled: true
    level: full
    per_frame_blocks: true
    heatmaps: false
    regions: true
    format: json
    binary_block_size_px: 64
    tau_artifact: 0.20
    q_region: 0.75
    r_morph_canvas_px: 6
  reconstruction:
    clip_sigma: 3.0
    clip_iterations: 3
    min_fraction: 0.5
    min_n_eff: 2.0
    chunk_rows: 0
    memory_budget_mb: 0
stacking:
  method: rej
  common_overlap_required_fraction: 1.0
  tile_common_valid_min_fraction: 1.0
  sigma_clip:
    sigma_low: 3.0
    sigma_high: 2.0  # asymmetrisch: wandernde Hotpixel-Streifen aggressiv kappen
    max_iters: 4
    min_fraction: 0.5
  cluster_quality_weighting:
    enabled: true
    kappa_cluster: 120.0
    cap_enabled: true
    cap_ratio: 20.0
  output_stretch: true
  cosmetic_correction: true
  cosmetic_correction_sigma: 4.0
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0

runtime_limits:
  acceleration_backend: auto
  allow_emergency_mode: true
  hard_abort_hours: 6
  memory_budget: 4096
  parallel_workers: 8
  tile_analysis_max_factor_vs_stack: 3
  tile_reconstruction_diagnostics: full

validation:
  max_background_rms_increase_percent: 2
  min_fwhm_improvement_percent: 3
  min_tile_weight_variance: 0.05
  require_no_tile_pattern: true
