method: aqmh
run_dir: ./run_mono_full_mode
log_level: info
scenario_profile:
  id: mono_full_mode
  title: MONO Full Mode
  intent: Robuster MONO-Betrieb mit Full-Mode Datensatzgroesse.
  gui2_scenarios:
    - mono
    - full_mode
    - alt_az
    - rotation_robust
  recommended_for:
    - N_usable >= assumptions.frames_reduced_threshold
    - Alt/Az Sessions mit Feldrotation und Wolkenluecken
  priority: balanced_quality
pipeline:
  mode: production
  abort_on_fail: false
output:
  registered_dir: registered
  write_registered_frames: true
  crop_to_nonzero_bbox: true
data:
  image_width: 3840
  image_height: 2160
  color_mode: OSC
  bayer_pattern: GBRG
  linear_required: true
input:
  pattern: ./data/*.fits
  sort: numeric
  max_frames: 0
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: strict
calibration:
  darks_dir: 
  flat_master: null
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: true
  dark_match_exposure_tolerance_percent: 5
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 2
  bias_dir: null
  use_bias: false
assumptions:
  frames_min: 50
  frames_reduced_threshold: 150
  reduced_mode_skip_clustering: true
  reduced_mode_cluster_range:
    - 5
    - 10
normalization:
  enabled: true
  mode: background
  per_channel: true
registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
dithering:
  enabled: true
  min_shift_px: 0.7
tile_denoise:
  soft_threshold:
    enabled: true
    blur_kernel: 31
    alpha: 1.8
    skip_star_tiles: true
  wiener:
    enabled: true
    snr_threshold: 5
    q_min: -0.5
    q_max: 1
    q_step: 0.1
    min_snr: 2
    max_iterations: 10
chroma_denoise:
  enabled: false
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.75
  star_protection:
    enabled: true
    threshold_sigma: 2.2
    dilate_px: 2
  structure_protection:
    enabled: true
    gradient_percentile: 85
  chroma_wavelet:
    enabled: true
    levels: 3
    threshold_scale: 1.25
    soft_k: 1
  chroma_bilateral:
    enabled: true
    sigma_spatial: 1.2
    sigma_range: 0.04
  blend:
    mode: chroma_only
    amount: 0.85
global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.8
  weights:
    background: 0.4
    fwhm: 0
    noise: 0.3
    gradient: 0.3
    roundness: 0
    star_count: 0
  clamp:
    - -3
    - 3
tile:
  size_factor: 32
  min_size: 64
  max_divisor: 6
  overlap_fraction: 0.25
  star_min_count: 8
  star_soft_count: 4
local_metrics:
  clamp:
    - -3
    - 3
  k_local: 1
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0
  spatial_regularization:
    enabled: false
    lambda: 0
    passes: 0
    tau_local: 1
  star_mode:
    weights:
      fwhm: 0.6
      roundness: 0.2
      contrast: 0.2
  structure_mode:
    metric_weight: 0.7
    background_weight: 0.3
synthetic:
  weighting: tile_weighted
  frames_min: 5
  frames_max: 30
  clustering:
    mode: kmeans
    cluster_count_range:
      - 5
      - 30
astrometry:
  enabled: true
  astap_bin: null
  astap_data_dir: /media/data/Astro/astap
  search_radius: 183
bge:
  enabled: false
  tile_weight_lambda_structure: 1
  autotune:
    enabled: false
    strategy: conservative
    max_evals: 24
    holdout_fraction: 0.25
    alpha_flatness: 0.25
    beta_roughness: 0.1
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.2
  structure_thresh_percentile: 0.9
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 3
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: /media/data/Astro/siril_catalog
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.9
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto
  fixed_log_d: 2
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits
aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    k_artifact: 3
    frac_artifact_max: 0.25
  storage:
    resolution_divisor: 1
    dtype: float32
    max_resident_maps: 2
  cherry_pick:
    enabled: false
    k_min: 3
    k_frac: 0.3
  diagnostics:
    tau_artifact: 0.2
    q_region: 0.75
    r_morph_canvas_px: 6
stacking:
  method: rej
  common_overlap_required_fraction: 1
  tile_common_valid_min_fraction: 1
  sigma_clip:
    sigma_low: 2
    sigma_high: 1.5
    max_iters: 3
    min_fraction: 0.4
  cluster_quality_weighting:
    enabled: true
    kappa_cluster: 1
    cap_enabled: false
    cap_ratio: 20
  output_stretch: false
  cosmetic_correction: true
  cosmetic_correction_sigma: 4
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2
validation:
  min_fwhm_improvement_percent: 5
  max_background_rms_increase_percent: 0
  min_tile_weight_variance: 0.1
  require_no_tile_pattern: true
runtime_limits:
  parallel_workers: 8
  memory_budget: 2048
  acceleration_backend: auto
  tile_analysis_max_factor_vs_stack: 3
  hard_abort_hours: 6
  allow_emergency_mode: false
  tile_reconstruction_diagnostics: full