run_dir: ./run_m31_background_gradient_balanced
log_level: info
scenario_profile:
  id: m31_background_gradient_balanced
  title: M31 Background Gradient Balanced
  intent: "M31/OSC mit Fokus auf Hintergrund-Gradientreduktion bei balancierter Farb- und Detailtreue."
  gui2_scenarios:
    - osc
    - m31
    - galaxy
    - background_gradient
  recommended_for:
    - M31 und aehnliche grosse diffuse Galaxien mit Hintergrundgradient
    - Alt/Az Sessions mit Feldrotation und Wolkenluecken
  priority: balanced_quality
output:
  registered_dir: registered
  write_registered_frames: true
  crop_to_nonzero_bbox: true
data:
  image_width: 3840
  image_height: 2160
  color_mode: OSC
  bayer_pattern: auto
input:
  pattern: ./data/*.fits
  sort: numeric
  max_frames: 0
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: strict
calibration:
  darks_dir: 
  flat_master: null
  flats_dir: null
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: true
  dark_match_exposure_tolerance_percent: 5
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 2
  bias_dir: null
  bias_master: null
  dark_master: null
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"
  use_bias: false
normalization:
  enabled: true
  mode: background
  per_channel: true
registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
  prewarp_interpolation: linear

dithering:
  enabled: true
chroma_denoise:
  enabled: false
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.75
  star_protection:
    enabled: true
    threshold_sigma: 2.2
    dilate_px: 2
  structure_protection:
    enabled: true
    gradient_percentile: 85
  chroma_wavelet:
    enabled: true
    levels: 3
    threshold_scale: 1.25
    soft_k: 1
  chroma_bilateral:
    enabled: true
    sigma_spatial: 1.2
    sigma_range: 0.04
  blend:
    mode: chroma_only
    amount: 0.85
global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.8
  weights:
    background: 0.4
    fwhm: 0
    noise: 0.3
    gradient: 0.3
    roundness: 0
    star_count: 0
  clamp:
    - -3
    - 3
astrometry:
  enabled: true
  astap_bin: null
  astap_data_dir: /media/data/Astro/astap
  search_radius: 183
bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 24
    holdout_fraction: 0.25
    alpha_flatness: 0.25
    beta_roughness: 0.1
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.2
  structure_thresh_percentile: 0.8
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.3
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard
  fit:
    method: rbf
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 3
  sigma_clip: 2.5
  background_model: plane
  background_neutralization_mode: auto
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  siril_catalog_dir: /media/data/Astro/siril_catalog
  apply_attenuation: true
  chroma_strength: 0.7
  k_max: 2.4
  max_condition_number: 3
  max_residual_rms: 0.9
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto
  fixed_log_d: 2
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits
stacking:
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2
runtime_limits:
  parallel_workers: 8
  memory_budget: 4096
  acceleration_backend: auto
  hard_abort_hours: 6

reconstruction:
  delete_source_cache_after_run: true
  clipping:
    clip_sigma_high: 4.0
    clip_sigma_low: 2.0
    min_n_eff: 2.0
  diagnostics:
    level: full
  drizzle:
    robust_passes: 4