method: aqmh
assumptions:
  frames_min: 30
  frames_reduced_threshold: 120
  reduced_mode_cluster_range:
    - 3
    - 10
  reduced_mode_skip_clustering: true
astrometry:
  astap_bin: ""
  astap_data_dir: /media/data/Astro/astap
  enabled: true
  search_radius: 183
bge:
  method: autobge
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 2.0
    downsample_scale: 4
    patch_size: 35
    patch_estimator: sigma_clipped_median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 10
    bright_exclusion_fraction: 0.2
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []      # Manuelle Ausschluss-Polygone (leer = keine)
    user_sample_points: []        # Manuelle AutoBGE-Sample-Punkte (leer = automatisch)
  tile_weight_lambda_structure: 1.0
  autotune:
    enabled: true # optionales deterministisches BGE-Autotuning (v3.3.6 §6.3.7)
    strategy: extended # conservative | extended
    max_evals: 24 # harte Obergrenze getesteter Kandidaten
    holdout_fraction: 0.25 # CV-Anteil, gueltig in [0.05, 0.50]
    alpha_flatness: 0.25 # Gewicht E_flat im Ziel J
    beta_roughness: 0.10 # Gewicht E_rough im Ziel J

  sample_estimator: quantile # quantile|sigma_clipped_median|sextractor_mode|biweight
  min_sample_bg_value: 1.0
  sample_quantile: 0.20 # Quantil fuer Tile-Background (0.20 = konservativ, 0.50 = median)
  structure_thresh_percentile: 0.65 # High-Structure-Tiles ausschliessen (0.65 = aggressiv, 0.90 = konservativ)
  min_tiles_per_cell: 3 # Mindestanzahl Tiles pro Grid-Cell
  min_valid_sample_fraction_for_apply: 0.30 # Mindestanteil valider robuster Tile-Samples je Kanal
  min_valid_samples_for_apply: 96 # absolute Untergrenze robuster Tile-Samples je Kanal
  mask:
    star_dilate_px: 4
    sat_dilate_px: 4
  grid:
    N_g: 32
    G_min_px: 64
    G_max_fraction: 0.25
    insufficient_cell_strategy: discard # discard | nearest | radius_expand
  fit:
    method: rbf # poly | spline | bicubic | rbf | modeled_mask_mesh
    robust_loss: huber # huber | tukey
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 1e-4
    polynomial_order: 2
    rbf_phi: multiquadric # thinplate | multiquadric | gaussian
    rbf_mu_factor: 1.5 # breitere RBF-Basis, vermeidet Wolkenbildung
    rbf_lambda: 1e-2 # staerkere Regularisierung, verhindert RBF-Ueberschwinger
    rbf_epsilon: 1.0 # sinnvoller Startwert fuer Multiquadric
calibration:
  bias_dir: ""
  bias_master: ""
  bias_use_master: false
  dark_auto_select: true
  dark_master: ""
  dark_match_exposure_tolerance_percent: 8
  dark_match_temp_tolerance_c: 3
  dark_match_use_temp: false
  dark_use_master: false
  dark_already_bias_corrected: false
  darks_dir: ""
  flat_master: ""
  flat_use_master: false
  flats_dir: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"
  use_bias: false
  use_dark: false
  use_flat: false
chroma_denoise:
  apply_stage: post_stack_linear
  blend:
    amount: 0.82
    mode: chroma_only
  chroma_bilateral:
    enabled: true
    sigma_range: 0.05
    sigma_spatial: 2
  chroma_wavelet:
    enabled: true
    levels: 4
    soft_k: 1.2
    threshold_scale: 1.9
  color_space: ycbcr_linear
  enabled: true
  luma_guard_strength: 0.88
  protect_luma: true
  star_protection:
    dilate_px: 3
    enabled: true
    threshold_sigma: 3
  structure_protection:
    enabled: true
    gradient_percentile: 94
data:
  color_mode: OSC
  bayer_pattern: auto
  image_width: 0
  image_height: 0
dithering:
  enabled: true
  min_shift_px: 0.7
global_metrics:
  adaptive_weights: true
  clamp:
    - -3
    - 3
  weight_exponent_scale: 1.2
  weights:
    background: 0.4
    fwhm: 0.0
    gradient: 0.25
    noise: 0.35
    roundness: 0.0
    star_count: 0.0
input:
  max_frames: 0
  pattern: ./data/*.fits
  sort: numeric
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: moderate
local_metrics:
  clamp:
    - -3
    - 3
  k_local: 1.0
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0.0
  spatial_regularization:
    enabled: false
    lambda: 0.0
    passes: 0
    tau_local: 1.0
  star_mode:
    weights:
      contrast: 0.2
      fwhm: 0.6
      roundness: 0.2
  structure_mode:
    background_weight: 0.3
    metric_weight: 0.7
log_level: info
normalization:
  enabled: true
  mode: median
  per_channel: true
output:
  crop_to_nonzero_bbox: true
  registered_dir: registered
  write_registered_frames: true
pcc:
  annulus_inner_fwhm_mult: 3
  annulus_inner_px: 10
  annulus_outer_fwhm_mult: 5
  annulus_outer_px: 16
  aperture_fwhm_mult: 1.8
  aperture_radius_px: 8
  apply_attenuation: true
  background_neutralization_mode: auto
  background_model: plane
  chroma_strength: 0.7
  enabled: true
  k_max: 2.4
  mag_bright_limit: 6
  mag_limit: 14
  max_condition_number: 3
  max_residual_rms: 0.5
  min_aperture_px: 4
  min_stars: 10
  radii_mode: auto_fwhm
  sigma_clip: 2.5
  siril_catalog_dir: ""
  source: siril
pipeline:
  abort_on_fail: false
  mode: production
registration:
  allow_rotation: true
  transform_model: affine
  enable_star_pair_fallback: true
  engine: triangle_star_matching
  reject_cc_min_abs: 0.25
  reject_outliers: true
  reject_scale_max: 1.08
  reject_scale_min: 0.92
  auto_engine: true  # bei erkannter Feldrotation automatisch auf triangle_star_matching+affine wechseln (Alt/Az)
  auto_engine_rotation_threshold_deg: 0.05  # Schwelle in Grad/Frame fuer Auto-Engine-Override
  # Neue Parameter (v2.0)
  max_blind_chain_depth: 0  # auto
  blind_chain_strong_anchor_cc: 0.05  # niedriger = mehr direkte Anker
  blind_chain_drift_threshold_px: 2.0
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200       # Alt/Az: Shift-Suchradius (px im Proxy); EQ-Montierung: 60
  reject_shift_median_multiplier: 5
  reject_shift_px_min: 100
  star_dist_bin_px: 5
  star_inlier_tol_px: 4
  star_min_inliers: 4
  star_topk: 80
run_dir: ./run_m42_emission_nebula_medium
runtime_limits:
  allow_emergency_mode: true
  hard_abort_hours: 6
  memory_budget: 4096
  acceleration_backend: auto # GPU-Backend: auto (CUDA->OpenCL->CPU), opencv_cuda (NVIDIA), opencv_opencl (AMD/Intel), cpu
  parallel_workers: 8
  tile_analysis_max_factor_vs_stack: 3
  tile_reconstruction_diagnostics: full
scenario_profile:
  gui2_scenarios:
    - osc
    - m42
    - emission_nebula
    - bright_core
    - short_exposure
  id: m42_emission_nebula_medium
  intent: M42/OSC mit Fokus auf Emissionsnebel-Struktur, hellem Trapezium-Kern und Erhalt von Hα/Hβ-Farbinformation.
  priority: emission_nebula_balanced_detail_and_color
  recommended_for:
    - M42 / Orionnebel mit hellem Kern und diffuser Emission
    - kurze OSC-Subframes mit vielen Einzelbildern
  title: M42 Emission Nebula Medium
hypermetric_stretch:
  enabled: true # VeraLux HMS nach PCC; erzeugt outputs/stacked_rgb_hms.fits
  require_successful_pcc: true # nur nach erfolgreicher PCC anwenden
  mode: ready_to_use # ready_to_use | scientific
  sensor_profile: rec709 # rec709 oder VeraLux-Profilname
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 8
  convergence_power: 3.5
  log_d_mode: auto # auto | fixed
  fixed_log_d: 2
  color_strategy: fixed # fixed entspricht Python-Slider-Default
  fixed_color_strategy: 0
  color_grip: 0.85
  shadow_convergence: 0
  linear_expansion: 0 # nur in scientific wirksam
  write_channels: false
  output_rgb: stacked_rgb_hms.fits

aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    k_artifact: 3.0
    frac_artifact_max: 0.25


  # Globale Qualitaetsgewichtung (v0.2.0)
  global_quality:
    g_floor: 0.05          # Untergrenze fuer globale Frame-Qualitaet G_f
    g_w_sharp: 0.6        # Gewicht Schaerfe in globaler Qualitaet
    g_w_snr: 0.4          # Gewicht SNR in globaler Qualitaet
    g_w_background_penalty: 0.3

  storage:
    resolution_divisor: 1
    dtype: float32
    max_resident_maps: 4
  cherry_pick:
    enabled: false
    k_min_required: 20
    k_frac: 0.30
    margin_min: 0.02      # Mindest-Rangabstand fuer Cherry-Pick-Auswahl
    tiered_k_frac: []      # Gestaffelte k_frac-Regeln (leer = k_frac fuer alle Pixel)

  # Validierungsgrenzen fuer rekonstruierte Tiles (v0.2.0)
  validation:
    max_seam_score_regression: 0.02   # Max. erlaubte Seam-Score-Regression
    max_fwhm_regression: 0.02           # Max. erlaubte FWHM-Regression
    max_background_rms_regression: 0.02  # Max. erlaubte Hintergrund-RMS-Regression
  diagnostics:
    enabled: true
    level: full
    per_frame_blocks: true
    heatmaps: false
    regions: true
    format: json
    binary_block_size_px: 64
    tau_artifact: 0.20
    q_region: 0.75
    r_morph_canvas_px: 6
  reconstruction:
    clip_sigma: 3.0
    clip_iterations: 3
    min_fraction: 0.5
    min_n_eff: 2.0
    chunk_rows: 0
    memory_budget_mb: 0

stacking:
  common_overlap_required_fraction: 1.0
  tile_common_valid_min_fraction: 1.0
  cluster_quality_weighting:
    cap_enabled: true
    cap_ratio: 20
    enabled: true
    kappa_cluster: 1
  cosmetic_correction: true
  cosmetic_correction_sigma: 4
  method: rej
  output_stretch: true
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.0
  sigma_clip:
    max_iters: 4
    min_fraction: 0.4
    sigma_high: 1.5
    sigma_low: 2.0
synthetic:
  clustering:
    cluster_count_range:
      - 3
      - 12
    mode: kmeans
  frames_max: 20
  frames_min: 4
  weighting: tile_weighted
tile:
  max_divisor: 6
  min_size: 48
  overlap_fraction: 0.4
  size_factor: 28
  star_min_count: 5
  star_soft_count: 3
tile_denoise:
  soft_threshold:
    alpha: 1.55
    blur_kernel: 21
    enabled: true
    skip_star_tiles: true
  wiener:
    enabled: true
    max_iterations: 10
    min_snr: 2.5
    q_max: 1
    q_min: -0.5
    q_step: 0.1
    snr_threshold: 3.5
validation:
  max_background_rms_increase_percent: 2
  min_fwhm_improvement_percent: 3
  min_tile_weight_variance: 0.05
  require_no_tile_pattern: true
