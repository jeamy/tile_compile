assumptions:
  frames_min: 30
  frames_reduced_threshold: 120
  reduced_mode_cluster_range:
    - 3
    - 10
  reduced_mode_skip_clustering: true
astrometry:
  astap_bin: /home/mux/.local/share/tile_compile/astap/astap_cli
  astap_data_dir: /home/mux/.local/share/tile_compile/astap
  enabled: true
  search_radius: 183
bge:
  autotune:
    alpha_flatness: 0.5
    beta_roughness: 0.06
    enabled: true
    holdout_fraction: 0.25
    max_evals: 32
    strategy: conservative
  enabled: true
  fit:
    huber_delta: 1.5
    irls_max_iterations: 12
    irls_tolerance: 1.00e-04
    method: poly
    polynomial_order: 2
    rbf_epsilon: 1.00e-06
    rbf_lambda: 1.00e-03
    rbf_mu_factor: 1.5
    rbf_phi: multiquadric
    robust_loss: tukey
  grid:
    G_max_fraction: 0.2
    G_min_px: 64
    N_g: 48
    insufficient_cell_strategy: nearest
  mask:
    sat_dilate_px: 10
    star_dilate_px: 10
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.2
  min_valid_samples_for_apply: 80
  sample_quantile: 0.15
  structure_thresh_percentile: 0.85
calibration:
  bias_dir: ""
  bias_master: ""
  bias_use_master: false
  dark_already_bias_corrected: false
  dark_auto_select: true
  dark_master: ""
  dark_match_exposure_tolerance_percent: 8
  dark_match_temp_tolerance_c: 3
  dark_match_use_temp: false
  dark_use_master: false
  darks_dir: ""
  flat_master: ""
  flat_use_master: false
  flats_dir: ""
  pattern: "*.fit;*.fits;*.fts;*.fit.fz;*.fits.fz;*.fts.fz"
  use_bias: false
  use_dark: false
  use_flat: false
chroma_denoise:
  apply_stage: post_pcc
  blend:
    amount: 1
    mode: chroma_only
  chroma_bilateral:
    enabled: true
    sigma_range: 0.04
    sigma_spatial: 2.2
  chroma_wavelet:
    enabled: true
    levels: 4
    soft_k: 1.3
    threshold_scale: 2.8
  color_space: ycbcr_linear
  enabled: true
  luma_guard_strength: 0.9
  protect_luma: true
  star_protection:
    dilate_px: 3
    enabled: true
    threshold_sigma: 3.2
  structure_protection:
    enabled: true
    gradient_percentile: 93
data:
  color_mode: OSC
  linear_required: true
dithering:
  enabled: true
  min_shift_px: 0.7
global_metrics:
  adaptive_weights: true
  clamp:
    - -3
    - 3
  weight_exponent_scale: 1.2
  weights:
    background: 0.55
    gradient: 0.15
    noise: 0.3
input:
  max_frames: 0
  pattern: ./data/*.fits
  sort: numeric
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: moderate
local_metrics:
  clamp:
    - -3
    - 3
  star_mode:
    weights:
      contrast: 0.2
      fwhm: 0.6
      roundness: 0.2
  structure_mode:
    background_weight: 0.3
    metric_weight: 0.7
log_level: info
normalization:
  enabled: true
  mode: background
  per_channel: true
output:
  crop_to_nonzero_bbox: true
  registered_dir: registered
  write_registered_frames: true
pcc:
  annulus_inner_fwhm_mult: 3
  annulus_inner_px: 10
  annulus_outer_fwhm_mult: 5
  annulus_outer_px: 16
  aperture_fwhm_mult: 1.8
  aperture_radius_px: 8
  apply_attenuation: true
  background_model: median
  background_neutralization_mode: always
  chroma_strength: 1
  enabled: true
  k_max: 1.8
  mag_bright_limit: 6
  mag_limit: 14
  max_condition_number: 2.2
  max_residual_rms: 0.9
  min_aperture_px: 4
  min_stars: 16
  radii_mode: auto_fwhm
  sigma_clip: 2
  siril_catalog_dir: ""
  source: siril
pipeline:
  abort_on_fail: false
  mode: production
registration:
  allow_rotation: true
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  enable_star_pair_fallback: true
  engine: triangle_star_matching
  reject_cc_min_abs: 0.25
  reject_outliers: true
  reject_scale_max: 1.08
  reject_scale_min: 0.92
  reject_shift_median_multiplier: 5
  reject_shift_px_min: 100
  star_dist_bin_px: 5
  star_inlier_tol_px: 4
  star_min_inliers: 4
  star_topk: 150
  transform_model: affine
run_dir: ./run_ic434_background_gradient
runtime_limits:
  acceleration_backend: auto
  allow_emergency_mode: true
  hard_abort_hours: 6
  memory_budget: 2048
  parallel_workers: 8
  tile_analysis_max_factor_vs_stack: 3
scenario_profile:
  gui2_scenarios:
    - osc
    - ic434
    - background_gradient
    - nebula
  id: ic434_background_gradient
  intent: IC434/OSC mit maximalem Fokus auf Hintergrundberuhigung und starke Gradientglaettung.
  priority: maximum_background_suppression
  recommended_for:
    - IC434 / Horsehead Nebula mit hartnaeckigem links/rechts-Gradienten im Hintergrund
    - wenn der Standard-IC434-Run noch sichtbare Hintergrundgradienten zuruecklaesst
  title: IC434 Background Gradient
stacking:
  cluster_quality_weighting:
    cap_enabled: true
    cap_ratio: 20
    enabled: true
    kappa_cluster: 1
  common_overlap_required_fraction: 1
  cosmetic_correction: true
  cosmetic_correction_sigma: 4
  method: rej
  output_stretch: false
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2.5
  sigma_clip:
    max_iters: 4
    min_fraction: 0.4
    sigma_high: 1.8
    sigma_low: 1.8
  tile_common_valid_min_fraction: 1
synthetic:
  clustering:
    cluster_count_range:
      - 3
      - 12
    mode: kmeans
  frames_max: 20
  frames_min: 4
  weighting: tile_weighted
tile:
  max_divisor: 6
  min_size: 48
  overlap_fraction: 0.3
  size_factor: 24
  star_min_count: 5
tile_denoise:
  soft_threshold:
    alpha: 1.6
    blur_kernel: 21
    enabled: true
    skip_star_tiles: true
  wiener:
    enabled: true
    max_iterations: 10
    min_snr: 2
    q_max: 1
    q_min: -0.5
    q_step: 0.1
    snr_threshold: 4
validation:
  max_background_rms_increase_percent: 2
  min_fwhm_improvement_percent: 3
  min_tile_weight_variance: 0.05
  require_no_tile_pattern: true