method: aqmh
run_dir: ./run_ic434_test
log_level: info
pipeline:
  mode: production
  abort_on_fail: false
output:
  registered_dir: registered
  write_registered_frames: true
  crop_to_nonzero_bbox: true
data:
  color_mode: OSC
  bayer_pattern: RGGB
  image_width: 0
  image_height: 0
input:
  pattern: ./data/*.fits
  sort: numeric
  max_frames: 0
linearity:
  enabled: true
  max_frames: 8
  min_overall_linearity: 0.9
  strictness: moderate
calibration:
  dark_master: ""
  darks_dir: ""
  use_bias: false
  use_dark: false
  use_flat: false
  bias_use_master: false
  dark_use_master: false
  dark_already_bias_corrected: false
  flat_use_master: false
  dark_auto_select: true
  dark_match_exposure_tolerance_percent: 8
  dark_match_use_temp: false
  dark_match_temp_tolerance_c: 3
  bias_dir: ""
  flats_dir: ""
  flat_master: ""
assumptions:
  frames_min: 30
  frames_reduced_threshold: 120
  reduced_mode_skip_clustering: true
  reduced_mode_cluster_range: [3, 10]
normalization:
  enabled: true
  mode: background
  per_channel: true
registration:
  engine: triangle_star_matching
  enable_star_pair_fallback: true
  allow_rotation: true
  transform_model: affine
  star_topk: 80
  star_min_inliers: 4
  star_inlier_tol_px: 4
  star_dist_bin_px: 5
  reject_outliers: true
  reject_cc_min_abs: 0.25
  reject_shift_px_min: 100
  reject_shift_median_multiplier: 5
  reject_scale_min: 0.92
  reject_scale_max: 1.08
  auto_engine: true
  auto_engine_rotation_threshold_deg: 0.05
  max_blind_chain_depth: 0
  blind_chain_strong_anchor_cc: 0.05
  blind_chain_drift_threshold_px: 2
  use_astrometry: true
  enable_local_background_subtraction: false
  star_shift_radius_px: 200
dithering:
  enabled: true
  min_shift_px: 0.7
tile_denoise:
  soft_threshold:
    enabled: true
    blur_kernel: 21
    alpha: 1.6
    skip_star_tiles: true
  wiener:
    enabled: true
    snr_threshold: 4
    q_min: -0.5
    q_max: 1
    q_step: 0.1
    min_snr: 2
    max_iterations: 10
chroma_denoise:
  enabled: true
  color_space: ycbcr_linear
  apply_stage: post_stack_linear
  protect_luma: true
  luma_guard_strength: 0.75
  star_protection:
    enabled: true
    threshold_sigma: 2.5
    dilate_px: 2
  structure_protection:
    enabled: true
    gradient_percentile: 87
  chroma_wavelet:
    enabled: true
    levels: 3
    threshold_scale: 1.5
    soft_k: 1
  chroma_bilateral:
    enabled: true
    sigma_spatial: 1.5
    sigma_range: 0.05
  blend:
    mode: chroma_only
    amount: 0.9
global_metrics:
  adaptive_weights: true
  weight_exponent_scale: 1.2
  weights:
    background: 0.4
    fwhm: 0
    noise: 0.35
    gradient: 0.25
    roundness: 0
    star_count: 0
  clamp: [-3, 3]
tile:
  size_factor: 24
  min_size: 48
  max_divisor: 6
  overlap_fraction: 0.3
  star_min_count: 5
  star_soft_count: 3
local_metrics:
  clamp: [-3, 3]
  k_local: 1
  neighborhood_normalization:
    enabled: false
    radius: 0
    blend: 0
  spatial_regularization:
    enabled: false
    lambda: 0
    passes: 0
    tau_local: 1
  star_mode:
    weights:
      fwhm: 0.6
      roundness: 0.2
      contrast: 0.2
  structure_mode:
    metric_weight: 0.7
    background_weight: 0.3
synthetic:
  weighting: tile_weighted
  frames_min: 4
  frames_max: 20
  clustering:
    mode: kmeans
    cluster_count_range: [3, 12]
astrometry:
  enabled: true
  astap_bin: ~
  astap_data_dir: /home/lux/.local/share/tile_compile/astap
  search_radius: 183
bge:
  method: classic
  autobge:
    num_sample_points: 800
    poly_degree: 2
    rbf_smooth: 0.5
    downsample_scale: 4
    patch_size: 25
    patch_estimator: median
    stretch_mode: linear
    stretch_target_median: 0.25
    border_margin: 30
    bright_exclusion_fraction: 0.3
    gradient_descent_max_iters: 100
    random_seed: 42
    normalize_between_stages: true
    apply_guards: true
    mono_mode: rgb_duplicate
    exclusion_polygons: []
    user_sample_points: []
  tile_weight_lambda_structure: 1
  autotune:
    enabled: true
    strategy: conservative
    max_evals: 32
    holdout_fraction: 0.2
    alpha_flatness: 0.4
    beta_roughness: 0.08
  sample_estimator: quantile
  min_sample_bg_value: 1
  sample_quantile: 0.15
  structure_thresh_percentile: 0.85
  min_tiles_per_cell: 3
  min_valid_sample_fraction_for_apply: 0.28
  min_valid_samples_for_apply: 96
  mask:
    star_dilate_px: 6
    sat_dilate_px: 6
  grid:
    N_g: 36
    G_min_px: 56
    G_max_fraction: 0.25
    insufficient_cell_strategy: radius_expand
  fit:
    method: poly
    robust_loss: huber
    huber_delta: 1.5
    irls_max_iterations: 10
    irls_tolerance: 0.0001
    polynomial_order: 2
    rbf_phi: multiquadric
    rbf_mu_factor: 1.5
    rbf_lambda: 0.01
    rbf_epsilon: 1
pcc:
  enabled: true
  source: siril
  mag_limit: 14
  mag_bright_limit: 6
  aperture_radius_px: 8
  annulus_inner_px: 10
  annulus_outer_px: 16
  min_stars: 10
  sigma_clip: 2.5
  siril_catalog_dir: ~
  background_model: plane
  max_condition_number: 3
  max_residual_rms: 0.9
  radii_mode: auto_fwhm
  aperture_fwhm_mult: 1.8
  annulus_inner_fwhm_mult: 3
  annulus_outer_fwhm_mult: 5
  min_aperture_px: 4
  apply_attenuation: true
  background_neutralization_mode: always
  chroma_strength: 1
  k_max: 2.4
hypermetric_stretch:
  enabled: true
  require_successful_pcc: true
  mode: ready_to_use
  sensor_profile: rec709
  fallback_profile: rec709
  adaptive_anchor: true
  target_bg: 0.15
  protect_b: 6
  convergence_power: 3.5
  log_d_mode: auto
  fixed_log_d: 2
  color_strategy: fixed
  fixed_color_strategy: 0
  color_grip: 1
  shadow_convergence: 0
  linear_expansion: 0
  write_channels: false
  output_rgb: stacked_rgb_hms.fits
aqmh:
  enabled: true
  pyramid:
    scales: 4
    base_window_px: 4
    w_sharp: 0.6
    w_snr: 0.4
    k_artifact: 3
    frac_artifact_max: 0.25
  global_quality:
    g_floor: 0.05
    g_w_sharp: 0.6
    g_w_snr: 0.4
  storage:
    resolution_divisor: 2
    dtype: uint16
    max_resident_maps: 2
  cherry_pick:
    enabled: false
    k_min_required: 20
    k_frac: 0.3
    margin_min: 0.02
    tiered_k_frac: []
  validation:
    max_seam_score_regression: 0.02
    max_fwhm_regression: 0.02
    max_background_rms_regression: 0.02
  diagnostics:
    enabled: true
    level: summary
    per_frame_blocks: true
    heatmaps: false
    regions: true
    format: json
    binary_block_size_px: 0
    tau_artifact: 0.2
    q_region: 0.75
    r_morph_canvas_px: 6
  reconstruction:
    clip_sigma: 3
    clip_iterations: 3
    min_fraction: 0.5
    min_n_eff: 2
    chunk_rows: 0
    memory_budget_mb: 0
stacking:
  method: rej
  common_overlap_required_fraction: 1
  tile_common_valid_min_fraction: 1
  sigma_clip:
    sigma_low: 2
    sigma_high: 1.5
    max_iters: 4
    min_fraction: 0.4
  cluster_quality_weighting:
    enabled: true
    kappa_cluster: 1
    cap_enabled: true
    cap_ratio: 20
  output_stretch: true
  cosmetic_correction: true
  cosmetic_correction_sigma: 4
  per_frame_cosmetic_correction: true
  per_frame_cosmetic_correction_sigma: 2
validation:
  min_fwhm_improvement_percent: 3
  max_background_rms_increase_percent: 2
  min_tile_weight_variance: 0.05
  require_no_tile_pattern: true
runtime_limits:
  parallel_workers: 8
  memory_budget: 2048
  acceleration_backend: auto
  tile_analysis_max_factor_vs_stack: 3
  hard_abort_hours: 6
  allow_emergency_mode: true
  tile_reconstruction_diagnostics: full