$schema: "http://json-schema.org/draft-07/schema#"
title: tile_compile v4 config
type: object
properties:
  method:
    type: string
    enum: [aqmh, classic_tile_compile]
    default: aqmh
    description: "Reconstruction method: 'aqmh' (AQMH First default) or 'classic_tile_compile'. If missing, defaults to 'aqmh'."
  pipeline:
    type: object
    properties:
      mode: {type: string, enum: [production, test]}
      abort_on_fail: {type: boolean}
  output:
    type: object
    properties:
      registered_dir: {type: string}
      write_registered_frames: {type: boolean}
      crop_to_nonzero_bbox: {type: boolean}
  data:
    type: object
    properties:
      image_width: {type: integer, minimum: 0}
      image_height: {type: integer, minimum: 0}
      color_mode: {type: string, enum: [OSC, MONO, RGB]}
      bayer_pattern: {type: string}
      linear_required:
        type: boolean
        deprecated: true
        description: "Deprecated: non-lineare Frames werden im Runner nur noch gewarnt (warn_only), nicht entfernt."
  linearity:
    type: object
    properties:
      enabled: {type: boolean}
      max_frames: {type: integer, minimum: 1}
      min_overall_linearity: {type: number, minimum: 0, maximum: 1}
      strictness: {type: string, enum: [strict, moderate, permissive]}
  calibration:
    type: object
    properties:
      use_bias: {type: boolean}
      use_dark: {type: boolean}
      use_flat: {type: boolean}
      bias_use_master: {type: boolean}
      dark_use_master: {type: boolean}
      dark_already_bias_corrected:
        type: boolean
        description: "True nur fuer Master-Darks, deren Bias-Pedestal bereits entfernt wurde."
      flat_use_master: {type: boolean}
      dark_auto_select: {type: boolean}
      dark_match_exposure_tolerance_percent: {type: number, minimum: 0}
      dark_match_use_temp: {type: boolean}
      dark_match_temp_tolerance_c: {type: number, minimum: 0}
      bias_dir: {type: string}
      darks_dir: {type: string}
      flats_dir: {type: string}
      bias_master: {type: string}
      dark_master: {type: string}
      flat_master: {type: string}
      pattern: {type: string}
  assumptions:
    type: object
    properties:
      frames_min: {type: integer, minimum: 1}
      frames_reduced_threshold:
        type: integer
        minimum: 1
        description: "Schwelle fuer Full Mode: frames_min..(threshold-1) = Reduced Mode, ab threshold = Full Mode."
      reduced_mode_skip_clustering:
        type: boolean
        description: "Wenn true, werden STATE_CLUSTERING und SYNTHETIC_FRAMES im Reduced-/Emergency-Mode uebersprungen."
      reduced_mode_cluster_range:
        type: array
        items: {type: integer, minimum: 1}
        minItems: 2
        maxItems: 2
  normalization:
    type: object
    properties:
      enabled: {type: boolean}
      mode:
        type: string
        enum: [background, median]
        description: "Frame normalization mode before stacking. 'background' subtracts a per-frame background estimate and normalizes to a reference level — DANGER for extended emission nebulae (M42, Orion, large HII regions): it will subtract real nebula signal as if it were background, destroying dynamic range and flattening the object. Use 'median' for any target where the object fills a significant fraction of the frame (>10%). 'background' is only safe for point sources, galaxy fields, or targets much smaller than the frame."
      per_channel: {type: boolean}
  registration:
    type: object
    description: "Registration with Temporal-Smoothing (v3.2.3+): Automatically uses neighbor frames (i-1, i+1) for failed registrations. Adaptive star detection: Falls back to 2.5σ threshold when <topk/2 stars detected."
    properties:
      engine: 
        type: string
        enum: [triangle_star_matching, star_similarity, hybrid_phase_ecc, robust_phase_ecc]
        description: "Primary registration engine. robust_phase_ecc recommended for nebula/clouds (LoG gradient preprocessing). triangle_star_matching for clear skies (faster, rotation-invariant)."
      transform_model:
        type: string
        enum: [similarity, affine]
        description: "Global transform family for star/feature registration. similarity keeps rotation plus uniform scale, affine additionally allows shear."
      enable_star_pair_fallback:
        type: boolean
        description: "Enable additional star-pair fallback between primary triangle and normative fallback cascade. strict profile disables this."
      allow_rotation: {type: boolean}
      star_topk: {type: integer, minimum: 3}
      star_min_inliers: {type: integer, minimum: 2}
      star_inlier_tol_px: {type: number, exclusiveMinimum: 0}
      star_dist_bin_px: {type: number, exclusiveMinimum: 0}
      reject_outliers: {type: boolean}
      reject_cc_min_abs: {type: number, minimum: 0, maximum: 1}
      reject_shift_px_min: {type: number, minimum: 0}
      reject_shift_median_multiplier: {type: number, exclusiveMinimum: 0}
      reject_scale_min: {type: number, exclusiveMinimum: 0}
      reject_scale_max: {type: number, exclusiveMinimum: 0}
      auto_engine:
        type: boolean
        description: "Wenn true, werden vor der Registrierung einige Probe-Frames analysiert. Bei erkannter starker Feldrotation (Alt/Az-Montierung) wird die Engine automatisch auf triangle_star_matching+affine umgestellt. Default: true."
      auto_engine_rotation_threshold_deg:
        type: number
        exclusiveMinimum: 0
        description: "Rotationsschwelle in Grad/Frame, ab der auto_engine den Override ausloest. Default: 0.05 (entspricht ~0.6 Grad/min bei 5s-Belichtungen — deutlich ueber EQ-Residualrotation <0.01 Grad/Frame, sicher unter jedem Alt/Az-Wert)."
      max_blind_chain_depth: {type: integer, minimum: 0, maximum: 100}
      blind_chain_strong_anchor_cc: {type: number, minimum: 0.01, maximum: 0.5}
      blind_chain_drift_threshold_px: {type: number, minimum: 0.5, maximum: 10.0}
      use_astrometry: {type: boolean}
      enable_local_background_subtraction: {type: boolean}
      star_shift_radius_px:
        type: number
        minimum: 10
        maximum: 2000
        description: "Search radius for the shift-consistency filter in triangle_star_matching (px in proxy image). Must cover the maximum expected inter-frame shift. Equatorial mount (EQ tracker): 60. Alt/Az (e.g. DWARF II, unguided): 200–400. WARNING: if set too small, frames with shifts exceeding this radius will silently fail registration (no error, just a bad warp with cc≈0). This causes chain_depth=0 for those frames. Never reduce below the measured maximum per-frame shift. If in doubt, leave at default 200."
  dithering:
    type: object
    properties:
      enabled: {type: boolean}
      min_shift_px: {type: number, minimum: 0}
  tile_denoise:
    type: object
    properties:
      soft_threshold:
        type: object
        properties:
          enabled: {type: boolean}
          blur_kernel: {type: integer, minimum: 3}
          alpha: {type: number, exclusiveMinimum: 0}
          skip_star_tiles: {type: boolean}
      wiener:
        type: object
        properties:
          enabled: {type: boolean}
          snr_threshold: {type: number, minimum: 0}
          q_min: {type: number, minimum: -1}
          q_max: {type: number, minimum: 0, maximum: 1}
          q_step: {type: number, exclusiveMinimum: 0}
          min_snr: {type: number, minimum: 0}
          max_iterations: {type: integer, minimum: 1}
  chroma_denoise:
    type: object
    properties:
      enabled: {type: boolean}
      color_space: {type: string, enum: [ycbcr_linear, opponent_linear]}
      apply_stage: {type: string, enum: [pre_stack_tiles, post_stack_linear]}
      protect_luma: {type: boolean}
      luma_guard_strength: {type: number, minimum: 0, maximum: 1}
      star_protection:
        type: object
        properties:
          enabled: {type: boolean}
          threshold_sigma: {type: number, exclusiveMinimum: 0}
          dilate_px: {type: integer, minimum: 0}
      structure_protection:
        type: object
        properties:
          enabled: {type: boolean}
          gradient_percentile: {type: number, minimum: 0, maximum: 100}
      chroma_wavelet:
        type: object
        properties:
          enabled: {type: boolean}
          levels: {type: integer, minimum: 1}
          threshold_scale: {type: number, exclusiveMinimum: 0}
          soft_k: {type: number, exclusiveMinimum: 0}
      chroma_bilateral:
        type: object
        properties:
          enabled: {type: boolean}
          sigma_spatial: {type: number, exclusiveMinimum: 0}
          sigma_range: {type: number, exclusiveMinimum: 0}
      blend:
        type: object
        properties:
          mode: {type: string, enum: [chroma_only]}
          amount: {type: number, minimum: 0, maximum: 1}
  global_metrics:
    type: object
    properties:
      adaptive_weights: {type: boolean}
      weight_exponent_scale:
        type: number
        exclusiveMinimum: 0
        description: "Exponent scale k for G_f = exp(k * Q_f). k=1.0 (default) is standard, k>1 increases differentiation between good/bad frames. E.g. k=1.5 gives typical ratio ~20:1, k=2.0 gives ~54:1. CRITICAL SIDE EFFECT ON REGISTRATION: This value also controls the quality-based anchor frame selection for registration. Higher k concentrates weight on fewer high-quality frames, which changes which frames are selected as registration anchors. Anchor frames clustered only in high-quality regions leave the rest of the sequence without nearby anchors, causing chain_depth=0 registration failures. HARD RULES: (1) For frame_count > 300: maximum allowed value is 1.2. Do NOT recommend values above 1.2 regardless of quality spread. (2) For frame_count 100-300: maximum allowed is 1.5 only if FWHM p90/p10 ratio > 1.5 (>50% spread). (3) Only for frame_count < 100 with extreme quality spread may k=2.0 be considered. Example: 610 frames → max k=1.2 even if quality spread appears high. Recommending k=2.0 for any dataset with >300 frames is WRONG and will cause registration failures."
      weights:
        type: object
        properties:
          background: {type: number, minimum: 0, maximum: 1}
          noise: {type: number, minimum: 0, maximum: 1}
          gradient: {type: number, minimum: 0, maximum: 1}
          fwhm: {type: number, minimum: 0, maximum: 1}
          roundness: {type: number, minimum: 0, maximum: 1}
          star_count: {type: number, minimum: 0, maximum: 1}
      clamp:
        type: array
        items: {type: number}
        minItems: 2
        maxItems: 2
  tile:
    type: object
    properties:
      size_factor: {type: integer, minimum: 1}
      min_size: {type: integer, minimum: 1}
      max_divisor: {type: integer, minimum: 1}
      overlap_fraction: {type: number, minimum: 0, maximum: 0.5}
      star_min_count: {type: integer, minimum: 0}
      star_soft_count: {type: integer, minimum: 0}
  local_metrics:
    type: object
    properties:
      clamp:
        type: array
        items: {type: number}
        minItems: 2
        maxItems: 2
      neighborhood_normalization:
        type: object
        properties:
          enabled: {type: boolean}
          radius: {type: integer, minimum: 0}
          blend: {type: number, minimum: 0, maximum: 1}
      spatial_regularization:
        type: object
        properties:
          enabled: {type: boolean}
          lambda: {type: number, minimum: 0, maximum: 1}
          passes: {type: integer, minimum: 0}
          tau_local: {type: number, exclusiveMinimum: 0}
      star_mode:
        type: object
        properties:
          weights:
            type: object
            properties:
              fwhm: {type: number, minimum: 0, maximum: 1}
              roundness: {type: number, minimum: 0, maximum: 1}
              contrast: {type: number, minimum: 0, maximum: 1}
      structure_mode:
        type: object
        properties:
          background_weight: {type: number, minimum: 0, maximum: 1}
          metric_weight: {type: number, minimum: 0, maximum: 1}
      k_local:
        type: number
        exclusiveMinimum: 0
        description: "Exponent scale for local weight L_{f,t}=exp(k_local*Q_local). Default 1.0; >1 increases local differentiation between tiles, <1 softens it. NOTE: unlike weight_exponent_scale, k_local does NOT affect registration anchor selection — it only influences per-tile weighting during reconstruction. Safe to tune independently. High values (>2.0) can cause tile boundary artifacts if local quality varies sharply across neighboring tiles."
  aqmh:
    type: object
    description: "AQMH-specific configuration. The 'enabled' flag is derived from the top-level 'method' field and should not be set manually."
    properties:
      enabled:
        type: boolean
        description: "Runtime flag derived from Config.method. true when method='aqmh', false when method='classic_tile_compile'."
      pyramid:
        type: object
        properties:
          scales: {type: integer, minimum: 1, maximum: 8}
          base_window_px: {type: integer, minimum: 1}
          w_sharp: {type: number, minimum: 0}
          w_snr: {type: number, minimum: 0}
          k_artifact: {type: number, exclusiveMinimum: 0}
          frac_artifact_max: {type: number, exclusiveMinimum: 0, maximum: 1}
      storage:
        type: object
        properties:
          resolution_divisor:
            type: integer
            enum: [1, 2, 4]
            description: "Downsamples stored AQMH quality maps. 1 keeps full resolution, 2 stores half width/height (~1/4 pixels), 4 stores quarter width/height. RULE when recommending together with cherry_pick: if you recommend cherry_pick.enabled=true in the same analysis, you MUST recommend resolution_divisor=1 (not 2, not 4). Divisor=2 is acceptable only when cherry_pick remains disabled. Reason: with cherry_pick active, the quality map resolution determines per-pixel selection accuracy; downsampled maps (divisor>1) cause spatially averaged quality decisions, negating the per-pixel benefit of cherry_pick. Recommending cherry_pick.enabled=true AND resolution_divisor=2 in the same update set is internally contradictory."
          dtype:
            type: string
            enum: [float32, uint16, uint8]
            description: "Storage data type for AQMH quality maps. float32 is exact; uint16 is recommended for lower disk and I/O cost; uint8 is smallest but coarser."
          max_resident_maps:
            type: integer
            minimum: 0
            maximum: 16
            description: "Maximum number of full-resolution AQMH quality maps kept in RAM by the reconstruction read cache. 0 disables the read cache."
      cherry_pick:
        type: object
        properties:
          enabled:
            type: boolean
            description: "Enables per-pixel best-k frame selection during reconstruction. The pipeline also enforces an internal quality gate: if cherry_pick increases background_rms by more than max_background_rms_increase_percent, it is automatically disabled regardless of this flag. Only recommend enabling when the frame set has a significant quality spread (FWHM p90/p10 ratio > 1.3 or >20% spread) AND k_frac is set conservatively (<=0.6). Do NOT recommend enabling for large homogeneous frame sets where quality spread is low — it increases per-pixel tile inconsistency and raises background_rms."
          k_min: {type: integer, minimum: 1}
          k_frac:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: "Fraction of total frames retained per pixel tile. E.g. 0.85 retains 85% of frames, discarding only the worst 15%. HARD RULES: (1) For frame_count > 300: maximum allowed k_frac is 0.5. Do NOT recommend k_frac > 0.5 regardless of the fraction of bad frames — with >300 frames, high k_frac causes per-pixel tile inconsistency (different pixel tiles use different frame subsets), which produces a raised background_rms that nullifies cherry_pick's quality benefit. The internal validation gate (max_background_rms_increase_percent) will also auto-disable cherry_pick if background_rms increases. (2) The correct way to target a specific bad fraction is: if ~15% of frames are bad, use k_frac=0.85 ONLY if frame_count < 100. For frame_count > 300 with 15% bad frames, use k_frac=0.85 is WRONG — use k_frac in [0.3, 0.5] instead, which discards 50–70% of lowest-quality frames. (3) For frame_count 100–300: k_frac <= 0.7. Example: 610 frames with 15% bad → correct k_frac is 0.4–0.5, NOT 0.85."
      diagnostics:
        type: object
        properties:
          tau_artifact: {type: number, minimum: 0, maximum: 1}
          q_region: {type: number, minimum: 0, maximum: 1}
          r_morph_canvas_px: {type: integer, minimum: 1}
  synthetic:
    type: object
    properties:
      weighting:
        type: string
        enum: [global, tile_weighted]
        description: "global = nur G_f; tile_weighted = W_f,t = G_f*L_f,t mit tileweiser OLA-Rekonstruktion."
      frames_min: {type: integer, minimum: 1}
      frames_max: {type: integer, minimum: 1}
      clustering:
        type: object
        properties:
          mode: {type: string, enum: [kmeans, quantile]}
          cluster_count_range:
            type: array
            items: {type: integer, minimum: 1}
            minItems: 2
            maxItems: 2
  astrometry:
    type: object
    properties:
      enabled: {type: boolean}
      astap_bin: {type: string}
      astap_data_dir: {type: string}
      search_radius: {type: integer, minimum: 1, maximum: 360}
  pcc:
    type: object
    properties:
      enabled: {type: boolean}
      apply_attenuation: {type: boolean}
      chroma_strength: {type: number, minimum: 0, maximum: 1}
      background_neutralization_mode: {type: string, enum: [always, auto, off]}
      source: {type: string, enum: [auto, siril, vizier_gaia, vizier_apass]}
      mag_limit:
        type: number
        minimum: 1
        maximum: 22
        description: "Magnitude limit for PCC catalog star matching. Higher values include fainter stars. CAUTION: for small sensors or dense star fields, mag_limit > 15 can include stars that are below the detection threshold of the actual frames, leading to phantom catalog matches against background noise. For typical consumer OSC cameras (DWARF II, Seestar) with short exposures, keep mag_limit <= 14–15. Only increase to 16–18 for large-aperture instruments with deep exposures where faint stars are reliably detected."
      mag_bright_limit: {type: number, minimum: 0, maximum: 15}
      aperture_radius_px: {type: number, exclusiveMinimum: 0}
      annulus_inner_px: {type: number, exclusiveMinimum: 0}
      annulus_outer_px: {type: number, exclusiveMinimum: 0}
      min_stars: {type: integer, minimum: 3}
      sigma_clip: {type: number, exclusiveMinimum: 0}
      background_model: {type: string, enum: [median, plane]}
      max_condition_number: {type: number, minimum: 1}
      max_residual_rms: {type: number, exclusiveMinimum: 0}
      radii_mode: {type: string, enum: [fixed, auto_fwhm]}
      aperture_fwhm_mult: {type: number, exclusiveMinimum: 0}
      annulus_inner_fwhm_mult: {type: number, exclusiveMinimum: 0}
      annulus_outer_fwhm_mult: {type: number, exclusiveMinimum: 0}
      min_aperture_px: {type: number, exclusiveMinimum: 0}
      k_max: {type: number, exclusiveMinimum: 0}
      siril_catalog_dir: {type: string}
  hypermetric_stretch:
    type: object
    properties:
      enabled: {type: boolean}
      require_successful_pcc: {type: boolean}
      mode: {type: string, enum: [ready_to_use, scientific]}
      sensor_profile: {type: string}
      fallback_profile: {type: string}
      adaptive_anchor: {type: boolean}
      target_bg: {type: number, minimum: 0.05, maximum: 0.50}
      protect_b: {type: number, minimum: 0.1}
      convergence_power: {type: number, minimum: 1.0, maximum: 10.0}
      log_d_mode: {type: string, enum: [auto, fixed]}
      fixed_log_d: {type: number, minimum: 0, maximum: 7}
      color_strategy: {type: string, enum: [auto, fixed]}
      fixed_color_strategy: {type: number, minimum: -1, maximum: 1}
      color_grip: {type: number, minimum: 0, maximum: 1}
      shadow_convergence: {type: number, minimum: 0}
      linear_expansion: {type: number, minimum: 0, maximum: 1}
      write_channels: {type: boolean}
      output_rgb: {type: string}
  bge:
    type: object
    properties:
      enabled:
        type: boolean
        description: "Background Gradient Equalizer. Fits and subtracts a smooth 2D background gradient across the stacked image. DANGER for extended emission nebulae (M42, Orion Nebula, large HII regions, large galaxies): the BGE gradient model cannot distinguish between real diffuse nebula emission and instrumental/sky gradients. It will model the nebula glow as background and subtract it, destroying the object. Only recommend enabling for compact targets (stars, small galaxies, tight clusters) where the object covers <5% of the frame area. For M42 or any target with large-scale diffuse emission, BGE must remain disabled (enabled: false)."
      autotune:
        type: object
        properties:
          enabled: {type: boolean}
          strategy: {type: string, enum: [conservative, extended]}
          max_evals: {type: integer, minimum: 1}
          holdout_fraction: {type: number, minimum: 0.05, maximum: 0.5}
          alpha_flatness: {type: number, minimum: 0}
          beta_roughness: {type: number, minimum: 0}
      tile_weight_lambda_structure:
        type: number
        exclusiveMinimum: 0
        description: "Lambda in tile reliability weight w_t=exp(-lambda*structure_score_t)*(1-masked_fraction_t). Default 1.0."
      sample_quantile: {type: number, exclusiveMinimum: 0, maximum: 0.5}
      sample_estimator:
        type: string
        enum: [quantile, sigma_clipped_median, sextractor_mode, biweight]
        description: "Tile background sample estimator. quantile uses bge.sample_quantile; sigma_clipped_median, sextractor_mode and biweight use robust tile-pixel estimators."
      min_sample_bg_value:
        type: number
        minimum: 0
        description: "Minimum tile background sample value accepted for BGE aggregation."
      structure_thresh_percentile: {type: number, minimum: 0, maximum: 1}
      min_tiles_per_cell: {type: integer, minimum: 1}
      min_valid_sample_fraction_for_apply: {type: number, exclusiveMinimum: 0, maximum: 1}
      min_valid_samples_for_apply: {type: integer, minimum: 1}
      mask:
        type: object
        properties:
          star_dilate_px: {type: integer, minimum: 0}
          sat_dilate_px: {type: integer, minimum: 0}
      grid:
        type: object
        properties:
          N_g: {type: integer, minimum: 1}
          G_min_px: {type: integer, minimum: 1}
          G_max_fraction: {type: number, exclusiveMinimum: 0, maximum: 1}
          insufficient_cell_strategy: {type: string, enum: [discard, nearest, radius_expand]}
      fit:
        type: object
        properties:
          method: {type: string, enum: [poly, spline, bicubic, rbf, modeled_mask_mesh]}
          robust_loss: {type: string, enum: [huber, tukey]}
          huber_delta: {type: number, exclusiveMinimum: 0}
          irls_max_iterations: {type: integer, minimum: 1}
          irls_tolerance: {type: number, exclusiveMinimum: 0}
          polynomial_order: {type: integer, enum: [2, 3]}
          rbf_phi: {type: string, enum: [thinplate, multiquadric, gaussian]}
          rbf_mu_factor: {type: number, exclusiveMinimum: 0}
          rbf_lambda: {type: number, exclusiveMinimum: 0}
          rbf_epsilon: {type: number, exclusiveMinimum: 0}
  stacking:
    type: object
    properties:
      method: {type: string, enum: [rej, average]}
      common_overlap_required_fraction:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: "Erforderlicher Pixel-Anteil ueber alle nutzbaren Frames fuer COMMON_OVERLAP. Default 1.0 = strikte Schnittmenge."
      tile_common_valid_min_fraction:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: "Mindestanteil gueltiger COMMON_OVERLAP-Pixel pro Tile. Default 1.0 = nur vollstaendig innerhalb der Support-Maske liegende Tiles."
      sigma_clip:
        type: object
        description: "Sigma-clipping parameters for stacking rejection. WARNING: sigma_low, sigma_high, and min_fraction interact — with small frame counts (<30), tight sigma values (sigma_low < 2.0 or sigma_high < 2.0) combined with min_fraction > 0.5 can reject most frames per pixel, leaving empty tiles or ghosting. For large frame counts (>200) the defaults are safe. Only tighten sigma if you have many frames AND visible cosmic ray artifacts in the output."
        properties:
          sigma_low: {type: number, exclusiveMinimum: 0}
          sigma_high: {type: number, exclusiveMinimum: 0}
          max_iters: {type: integer, minimum: 1}
          min_fraction: {type: number, minimum: 0, maximum: 1}
      cluster_quality_weighting:
        type: object
        properties:
          enabled:
            type: boolean
            description: "Aktiviert v3.2.2 Cluster-Qualitaetsgewichtung im finalen Stack: w_k = exp(kappa_cluster * Q_k)."
          kappa_cluster:
            type: number
            exclusiveMinimum: 0
            description: "Exponentfaktor fuer Cluster-Qualitaet Q_k (Q_k in [-3,+3])."
          cap_enabled:
            type: boolean
            description: "Aktiviert optionales Dominanz-Cap fuer Clustergewichte."
          cap_ratio:
            type: number
            exclusiveMinimum: 0
            description: "Nur mit cap_enabled=true: begrenzt Gewicht auf w_k <= cap_ratio * median_j(w_j)."
      output_stretch:
        type: boolean
        description: "Optionaler linearer Anzeige-Stretch auf den Ausgabe-Daten (Post-Processing, nicht Teil des linearen Pflichtkerns)."
      cosmetic_correction:
        type: boolean
        description: "Optionale Hotpixel-/Artefakt-Kosmetik nach dem Stacken (Post-Processing, standardmaessig deaktiviert)."
      cosmetic_correction_sigma:
        type: number
        exclusiveMinimum: 0
        description: "Schwellwert in Vielfachen der MAD-Sigma fuer die Hotpixel-Erkennung in cosmetic_correction. Niedrigerer Wert = aggressiver. Default: 5.0, empfohlen fuer OSC/Seestar: 10.0."
      per_frame_cosmetic_correction:
        type: boolean
        description: "Hotpixel-Korrektur pro Frame VOR dem Stacken. Entfernt fixe Sensordefekte (immer gleiche Position), die Sigma-Clipping nicht erkennt. Empfohlen fuer OSC-Kameras mit fixen Hot Pixeln."
      per_frame_cosmetic_correction_sigma:
        type: number
        exclusiveMinimum: 0
        description: "Sigma-Schwelle fuer per_frame_cosmetic_correction. Niedrigerer Wert = aggressiver. Default: 5.0. Fuer Seestar/OSC empfohlen: 5.0."
  validation:
    type: object
    properties:
      min_fwhm_improvement_percent: {type: number}
      max_background_rms_increase_percent: {type: number}
      min_tile_weight_variance: {type: number, minimum: 0}
      require_no_tile_pattern: {type: boolean}
  runtime_limits:
    type: object
    properties:
      parallel_workers:
        type: integer
        minimum: 1
        description: "Anzahl paralleler Worker fuer Tile-Phasen; wird zusaetzlich durch CPU-Kerne und OSC-Speicherbudget begrenzt."
      memory_budget:
        type: integer
        minimum: 1
        description: "Speicherbudget in MiB fuer OSC-Worker-Cap bei Tile-Rekonstruktion."
      acceleration_backend:
        type: string
        enum: [auto, cpu, opencv_cuda, opencv_opencl, opencl, cuda]
        default: auto
        description: "Beschleunigungs-Backend fuer PREWARP/TILE_RECONSTRUCTION/STACKING. 'auto' (Standard) erkennt automatisch verfuegbare GPU-Backends (CUDA/OpenCL) zur Laufzeit. Prioritaet: CUDA -> OpenCL -> CPU. 'opencv_cuda' erzwingt NVIDIA CUDA, 'opencv_opencl'/'opencl' erzwingt OpenCL (AMD/Intel/NVIDIA), 'cpu' deaktiviert GPU. Faellt sauber auf CPU zurueck wenn Hardware nicht verfuegbar."
      tile_reconstruction_diagnostics:
        type: string
        enum: [full, minimal, off]
        default: full
      tile_analysis_max_factor_vs_stack: {type: number, exclusiveMinimum: 0}
      hard_abort_hours: {type: number, exclusiveMinimum: 0}
      allow_emergency_mode:
        type: boolean
        description: "Erlaubt Emergency-Mode fuer Datensaetze mit <50 nutzbaren Frames; sonst wird der Lauf kontrolliert abgebrochen."
