<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Dashboard</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-ui);
    background: var(--bg-page);
    color: var(--foreground);
    margin: 0;
    padding: var(--space-6);
    min-width: 0;
  }
  h1 { font-size: var(--text-lg); margin: 0 0 var(--space-1); font-weight: 600; }
  h2 {
    font-size: var(--text-sm); margin: var(--space-6) 0 var(--space-3);
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border); padding-bottom: var(--space-2);
  }
  .meta { color: var(--muted); font-size: var(--text-xs); margin-bottom: var(--space-5); }
  .meta .sep { margin: 0 var(--space-2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--space-4) var(--space-5);
    min-width: 0;
    overflow: hidden;
  }

  .phase-card { margin-bottom: var(--space-5); }
  .phase-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: var(--space-3); min-width: 0;
  }
  .phase-name { font-size: var(--text-base); font-weight: 600; }
  .phase-sub {
    color: var(--muted); font-size: var(--text-xs); font-family: var(--font-mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1;
    text-align: right;
  }
  .bar-track {
    background: var(--surface-2); border-radius: var(--radius-sm); height: 10px;
    overflow: hidden; margin-top: var(--space-3);
  }
  .bar-fill { background: var(--primary); height: 100%; transition: width 0.4s ease; border-radius: var(--radius-sm); }
  .bar-fill.done { background: var(--success); }
  .bar-fill.err  { background: var(--error); }

  table.phase-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); table-layout: fixed; }
  table.phase-table col.c-name { width: auto; }
  table.phase-table col.c-status { width: 90px; }
  table.phase-table col.c-dur { width: 90px; }
  .phase-table td, .phase-table th {
    padding: var(--space-2) var(--space-2);
    border-bottom: 1px solid var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .phase-table th { color: var(--muted); font-weight: 500; text-align: left; font-size: var(--text-xs); }
  .phase-table td.num { text-align: right; font-family: var(--font-mono); }
  .pill {
    display: inline-block; padding: 1px var(--space-2); border-radius: 999px; font-size: var(--text-xs);
    background: var(--surface-2); white-space: nowrap;
  }
  .pill.ok   { background: var(--success-bg); color: var(--success); }
  .pill.err  { background: var(--error-bg);   color: var(--error); }
  .pill.run  { background: var(--info-bg);    color: var(--info); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: var(--space-4);
    min-width: 0;
  }
  .artifact-card { min-width: 0; }
  .artifact-title {
    font-weight: 600; font-size: var(--text-sm); margin-bottom: var(--space-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.kv { width: 100%; border-collapse: collapse; font-size: var(--text-xs); table-layout: fixed; }
  table.kv col.k { width: 58%; }
  table.kv col.v { width: 42%; }
  table.kv td {
    padding: 2px 0; border-bottom: 1px solid var(--border);
    vertical-align: top; overflow-wrap: anywhere; word-break: break-word;
  }
  table.kv td.k { color: var(--muted); padding-right: var(--space-2); }
  table.kv td.v { text-align: right; font-family: var(--font-mono); }
  .empty { color: var(--muted); font-size: var(--text-xs); font-style: italic; }

  .footer { margin-top: var(--space-6); color: var(--muted); font-size: var(--text-xs); }
</style>
</head>
<body>
  <h1 id="title">Run Dashboard</h1>
  <div class="meta" id="meta">lädt…</div>

  <div class="card phase-card">
    <div class="phase-head">
      <span class="phase-name" id="cur-phase">–</span>
      <span class="phase-sub" id="cur-substep"></span>
    </div>
    <div class="bar-track"><div id="cur-bar" class="bar-fill" style="width:0%"></div></div>
  </div>

  <h2>Phasen</h2>
  <table class="phase-table">
    <colgroup><col class="c-name"><col class="c-status"><col class="c-dur"></colgroup>
    <thead><tr><th>Phase</th><th>Status</th><th style="text-align:right">Dauer</th></tr></thead>
    <tbody id="phase-tbody"></tbody>
  </table>

  <h2>Artefakte</h2>
  <div class="grid" id="artifact-grid"></div>

  <div class="footer" id="footer"></div>

<script>
const REFRESH_MS = 5000;
const params = new URLSearchParams(location.search);
const RUN_ID = params.get("run") || params.get("run_id") || "";

// Curated list of artifacts worth surfacing on the live dashboard
// (paths as returned by /api/runs/<id>/artifacts, relative to run_dir).
const ARTIFACT_NAMES = [
  "artifacts/bge.json",
  "artifacts/chroma_denoise.json",
  "artifacts/global_metrics.json",
  "artifacts/global_registration.json",
  "artifacts/registration_sampling.json",
  "artifacts/sampling_geometry.json",
  "artifacts/forward_common_overlap.json",
  "artifacts/source_quality_plan.json",
  "artifacts/forward_drizzle.json",
  "artifacts/forward_downstream_inputs.json",
];

function fmtDur(ms) {
  if (ms == null || ms < 0 || !isFinite(ms)) return "–";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s / 60);
  return m + "m " + Math.round(s - m * 60) + "s";
}

function fmtVal(v) {
  if (typeof v === "number") {
    if (Number.isInteger(v)) return String(v);
    return Math.abs(v) < 1e-4 || Math.abs(v) >= 1e6 ? v.toExponential(3) : v.toFixed(5).replace(/0+$/,"").replace(/\.$/,"");
  }
  return String(v);
}

// Flatten a JSON object into [path, value] rows. Skips long prose strings
// (documentation-style values embedded in some artifacts) so the panel
// stays a table of numbers/short flags, not a wall of text.
function flatten(obj, prefix, out) {
  if (obj === null || obj === undefined) return;
  if (Array.isArray(obj)) {
    if (obj.length && typeof obj[0] === "object" && obj[0] !== null) {
      flatten(obj[obj.length - 1], prefix, out); // e.g. chroma_denoise "passes" -> last pass
    } else if (obj.length <= 6) {
      out.push([prefix, "[" + obj.map(fmtVal).join(", ") + "]"]);
    }
    return;
  }
  if (typeof obj === "object") {
    for (const k of Object.keys(obj)) flatten(obj[k], prefix ? prefix + "." + k : k, out);
    return;
  }
  if (typeof obj === "string" && obj.length > 50) return; // prose, not a metric
  out.push([prefix, fmtVal(obj)]);
}

async function getJSON(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

let artifactListCache = null;

function runDirQuery() {
  const rd = params.get("run_dir");
  return rd ? `&run_dir=${encodeURIComponent(rd)}` : "";
}

async function renderArtifacts() {
  const grid = document.getElementById("artifact-grid");
  if (!artifactListCache) {
    const list = await getJSON(`/api/runs/${encodeURIComponent(RUN_ID)}/artifacts?_=1${runDirQuery()}`);
    artifactListCache = new Set((list?.items || []).map(it => it.path || it.relative_path));
  }
  grid.innerHTML = "";
  for (const name of ARTIFACT_NAMES) {
    const card = document.createElement("div");
    card.className = "card artifact-card";
    const present = artifactListCache.has(name);
    let rows = "";
    if (present) {
      const view = await getJSON(`/api/runs/${encodeURIComponent(RUN_ID)}/artifacts/view?path=${encodeURIComponent(name)}${runDirQuery()}`);
      const data = view?.json;
      if (data) {
        const flat = [];
        flatten(data, "", flat);
        rows = flat.slice(0, 30).map(([k, v]) =>
          `<tr><td class="k">${k || "(value)"}</td><td class="v">${v}</td></tr>`).join("");
      }
    }
    card.innerHTML = `<div class="artifact-title">${name.split("/").pop()}</div>` +
      (rows ? `<table class="kv"><colgroup><col class="k"><col class="v"></colgroup><tbody>${rows}</tbody></table>`
            : `<div class="empty">noch nicht vorhanden</div>`);
    grid.appendChild(card);
  }
}

// Fallback for backends without `duration_s` in `status.phases`: derive
// per-phase durations from the `events` tail (phase_start/phase_end pairs).
// The tail is capped, so early phases (SCAN_INPUT, NORMALIZATION) get lost on
// long runs -- the backend-provided `duration_s` covers the whole event file.
function phaseDurations(events) {
  const durations = {};
  const starts = {};
  for (const ev of events || []) {
    if (!ev.phase_name) continue;
    const t = Date.parse(ev.ts);
    if (ev.type === "phase_start") starts[ev.phase_name] = t;
    if (ev.type === "phase_end" && starts[ev.phase_name] != null) {
      durations[ev.phase_name] = t - starts[ev.phase_name];
    }
  }
  return durations;
}

// Terminal states: nothing left to poll for, whether the run itself
// succeeded, failed, or was cancelled/stopped.
const TERMINAL_STATES = new Set([
  "completed", "ok", "done", "error", "failed", "cancelled", "stopped", "aborted",
]);

async function renderStatus() {
  const runDirParam = params.get("run_dir") ? `&run_dir=${encodeURIComponent(params.get("run_dir"))}` : "";
  const status = await getJSON(`/api/runs/${encodeURIComponent(RUN_ID)}/status?_=${Date.now()}${runDirParam}`);
  if (!status) {
    document.getElementById("meta").textContent = "Run nicht gefunden.";
    return true; // nothing to poll for either way
  }
  document.getElementById("title").textContent = "Run Dashboard — " + RUN_ID;
  document.getElementById("meta").innerHTML =
    "Status: " + (status.status || "?") +
    `<span class="sep">·</span>run_dir: ${status.run_dir || "?"}`;

  const phases = status.phases || [];
  const curPhase = status.current_phase;
  const curEntry = phases.find(p => (p.phase || p.name) === curPhase);
  const durations = phaseDurations(status.events);

  const isDone = status.status === "completed" || status.status === "ok" || status.status === "done";
  const isErr = status.status === "error" || status.status === "failed";
  document.getElementById("cur-phase").textContent = curPhase || (isDone ? "abgeschlossen" : (status.status || "–"));
  const pct = curEntry ? (curEntry.pct ?? 0) : (status.progress ?? 0);
  const pctNum = pct > 1 ? pct : pct * 100;
  const bar = document.getElementById("cur-bar");
  bar.style.width = Math.min(100, Math.max(0, pctNum)).toFixed(0) + "%";
  bar.className = "bar-fill" + (isErr ? " err" : isDone ? " done" : "");
  document.getElementById("cur-substep").textContent = curEntry?.substep || "";

  const tbody = document.getElementById("phase-tbody");
  tbody.innerHTML = "";
  for (const p of phases) {
    const name = p.phase || p.name || "?";
    const st = (p.status || "pending");
    const cls = st === "running" ? "run" : (st === "ok" || st === "done" ? "ok" : (st === "pending" ? "" : "err"));
    const durMs = typeof p.duration_s === "number" ? p.duration_s * 1000 : durations[name];
    const dur = durMs != null ? fmtDur(durMs) : "–";
    tbody.innerHTML += `<tr><td>${name}</td><td><span class="pill ${cls}">${st}</span></td><td class="num">${dur}</td></tr>`;
  }

  return TERMINAL_STATES.has(status.status);
}

let pollHandle = null;

async function tick() {
  const [isTerminal] = await Promise.all([renderStatus(), renderArtifacts()]);
  const footer = document.getElementById("footer");
  if (isTerminal) {
    if (pollHandle) { clearInterval(pollHandle); pollHandle = null; }
    footer.textContent = "Run beendet — keine weiteren Updates. Letzter Stand: " + new Date().toLocaleTimeString();
  } else {
    footer.textContent = "letztes Update: " + new Date().toLocaleTimeString();
  }
}

if (!RUN_ID) {
  document.getElementById("meta").textContent = "Kein Run angegeben (?run=<id> fehlt).";
} else {
  tick();
  pollHandle = setInterval(tick, REFRESH_MS);
}
</script>
</body>
</html>
